function fmtDate(d) {
  if (!d) return "—";
  try {
    const dt = new Date(d);
    return dt.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch { return d; }
}
function fmtDateTimeShort(v) {
  if (!v) return "—";
  try {
    const d = new Date(v);
    if (isNaN(d.getTime())) return v;
    return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch { return v; }
}

/* Horas por registro — usa datas completas, então vira o dia automaticamente.
   Não é mostrado no relatório/tela, mas fica calculado para exportar. */
function registroHoras(r) {
  if (!r.inicio || !r.fim) return 0;
  const a = new Date(r.inicio), b = new Date(r.fim);
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return 0;
  const diffMs = b - a;
  if (diffMs <= 0) return null; // inválido — fim antes/igual ao início
  return diffMs / 3600000;
}
function totalHoras(registros) {
  return registros.reduce((sum, r) => {
    const h = registroHoras(r);
    return sum + (h || 0);
  }, 0);
}
function areaLabel(r) {
  return r.area === "Outra (especificar)" ? (r.areaOutra || "Outra") : (r.area || "—");
}

   API — os dados ficam no servidor (banco de dados); login por cookie seguro
----------------------------------------------------------------*/
async function api(path, method = "GET", body) {
  const res = await fetch("/api" + path, {
    method, credentials: "same-origin",
    headers: body !== undefined ? { "Content-Type": "application/json" } : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.detail && (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))) || ("Erro " + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}
function pdfToBase64(doc) {
  const ab = doc.output("arraybuffer");
  let bin = ""; const bytes = new Uint8Array(ab); const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(bin);
}

function pdfBand(doc, x, y, w, text) {

}
function pdfKV(doc, x, y, w, label, value) {
  doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(100, 110, 122);
  doc.text(label.toUpperCase(), x, y);

  const lines = doc.splitTextToSize(String(value == null || value === "" ? "—" : value), w);
  doc.text(lines, x, y + 4.4);
  return y + 4.4 + lines.length * 4.3;
}
function pdfFileName(report) {
  const empresaSlug = (report.empresa || "Hidrojato").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "");
  return `Relatorio-${empresaSlug}-${report.numero}.pdf`;
}
function loadImageSize(dataUrl) {
  return new Promise((resolve) => {
    if (!dataUrl) { resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

/* ---------------------------------------------------------------
   Auditoria — placas repetidas em coordenações diferentes
   com intervalos de horário sobrepostos (impossível fisicamente)
----------------------------------------------------------------*/
function findPlateConflicts(reports) {
  const entries = [];
  reports.forEach((r) => {
    (r.registros || []).forEach((reg) => {
      if (!reg.inicio || !reg.fim || !r.placaTag) return;
      const a = new Date(reg.inicio), b = new Date(reg.fim);
      if (isNaN(a) || isNaN(b) || b <= a) return;
      entries.push({
        reportId: r.id, numero: r.numero, placa: r.placaTag, coordenacao: r.coordenacao,
        empresa: r.empresa, inicio: a, fim: b, servicos: reg.servicos,
      });
    });
  });
  const conflicts = [];
  for (let i = 0; i < entries.length; i++) {
    for (let j = i + 1; j < entries.length; j++) {
      const e1 = entries[i], e2 = entries[j];
      if (e1.reportId === e2.reportId) continue;
      if (!e1.placa || e1.placa !== e2.placa) continue;
      if (e1.coordenacao === e2.coordenacao) continue;
      const overlap = e1.inicio < e2.fim && e2.inicio < e1.fim;
      if (overlap) conflicts.push({ placa: e1.placa, a: e1, b: e2 });
    }
  }
  return conflicts;
}

/* ---------------------------------------------------------------
   CSV export — uma linha por registro, para Excel/BI
----------------------------------------------------------------*/
function exportCSV(reports) {
  const headers = ["Numero","Empresa","Coordenacao","Cliente","Placa","Data","Equipamentos","Saida",
    "RegistroInicio","RegistroFim","HorasRegistro","Servicos","Area","EquipeCampo",
    "SupervisorEmpresa","MatriculaSupervisorEmpresa","OperadorCenibra","MatriculaOperadorCenibra",
    "SupervisorOperacionalCenibra","MatriculaSupervisorCenibra","Status","EmailStatus"];
  const rows = [];
  reports.forEach((r) => {
    const statusLabel = r.stageIndex >= STAGES.length ? "Concluido" : `Aguardando ${stageLabel(STAGES[r.stageIndex], r)}`;
    const resp = r.responsaveis || {};
    const equipeCampoStr = (r.equipeCampo || []).map((m) => (m.matricula ? `${m.nome} (${m.matricula})` : m.nome)).join(" | ");
    (r.registros || []).forEach((reg) => {
      const h = registroHoras(reg);
      rows.push([
        r.numero, r.empresa, r.coordenacao, "Cenibra", r.placaTag, r.data,
        (r.equipamentos || []).join(" | "), r.saida,
        reg.inicio, reg.fim, h == null ? "0" : h.toFixed(2),
        (reg.servicos || "").replace(/\n/g, " "), areaLabel(reg), equipeCampoStr,
        (resp.supervisor_empresa && resp.supervisor_empresa.nome) || "", (resp.supervisor_empresa && resp.supervisor_empresa.matricula) || "",
        (resp.cenibra_operador && resp.cenibra_operador.nome) || "", (resp.cenibra_operador && resp.cenibra_operador.matricula) || "",
        (resp.cenibra_supervisor && resp.cenibra_supervisor.nome) || "", (resp.cenibra_supervisor && resp.cenibra_supervisor.matricula) || "",
        statusLabel, r.emailStatus || "",
      ]);
    });
  });
  const csv = [headers, ...rows].map((row) => row.map((v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`).join(";")).join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `relatorios-servitec-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------------
   Signature Pad
----------------------------------------------------------------*/
function SignaturePad({ onChange, height = 140 }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const empty = useRef(true);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  };

  const start = (e) => {
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    drawing.current = true;
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    ctx.lineTo(x, y);
    ctx.strokeStyle = T.ink;
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.stroke();
    empty.current = false;
  };
  const end = () => {
    if (!drawing.current) return;
    drawing.current = false;
    if (!empty.current) onChange(canvasRef.current.toDataURL("image/png"));
  };
  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    empty.current = true;
    onChange(null);
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={480}
        height={height}
        style={{ width: "100%", height, background: "#fff", border: `1.5px dashed ${T.line}`, borderRadius: 8, touchAction: "none", cursor: "crosshair" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <div className="flex justify-between items-center mt-1.5">
        <span style={{ fontSize: 11, color: T.inkSoft, fontFamily: "Segoe UI, Selawik, Arial, sans-serif" }}>Assine com o dedo ou mouse</span>
        <button onClick={clear} style={{ fontSize: 12, color: T.orangeDeep, fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 600, background: "none", border: "none", cursor: "pointer" }}>Limpar</button>

function TextInput(props) {

function TextArea(props) {

function Btn({ children, onClick, variant = "primary", disabled, style, type = "button" }) {
  const base = {
    fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 600, fontSize: 14, padding: "10px 18px",
    borderRadius: 8, border: "none", cursor: disabled ? "not-allowed" : "pointer",
    display: "inline-flex", alignItems: "center", gap: 6, opacity: disabled ? 0.5 : 1,
    transition: "transform .1s",
  };
  const variants = {
    primary: { background: T.orange, color: "#fff" },
    dark: { background: T.ink, color: "#fff" },
    ghost: { background: "transparent", color: T.ink, border: `1.5px solid ${T.line}` },

    <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, fontWeight: 700, background: bg, color, padding: "3px 10px", borderRadius: 20, whiteSpace: "nowrap" }}>

----------------------------------------------------------------*/
function StageTracker({ stageIndex, report }) {
  return (
    <div className="flex items-center" style={{ width: "100%", padding: "4px 2px" }}>
      {STAGES.map((s, i) => {
        const state = i < stageIndex ? "done" : i === stageIndex ? "active" : "pending";
        return (
          <React.Fragment key={s.key}>
            <div className="flex flex-col items-center" style={{ minWidth: 70 }}>
              <div style={{
                width: 30, height: 30, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                background: state === "done" ? T.green : state === "active" ? T.orange : "#fff",

              }}>
                {state === "done" ? <Check size={15} color="#fff" style={{ strokeWidth: 3 }} /> :
                  <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12.5, fontWeight: 600, color: state === "active" ? "#fff" : "#9AA5B1" }}>{i + 1}</span>}
              </div>
              <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 9, fontWeight: 600, color: state === "pending" ? "#9AA5B1" : T.ink, marginTop: 4, textAlign: "center", lineHeight: 1.15 }}>

          </React.Fragment>

      })}

}

/* ---------------------------------------------------------------
   Photo capture
----------------------------------------------------------------*/
function resizeImage(dataUrl, maxW = 900) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.src = dataUrl;
  });
}

function PhotoCapture({ value, onChange }) {
  const inputRef = useRef(null);
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const resized = await resizeImage(reader.result);
      onChange(resized);
    };
    reader.readAsDataURL(file);
  };
  return (
    <div>
      {value ? (
        <div className="relative" style={{ borderRadius: 10, overflow: "hidden", border: `1.5px solid ${T.line}` }}>
          <img src={value} alt="Placa" style={{ width: "100%", display: "block", maxHeight: 260, objectFit: "cover" }} />
          <button onClick={() => inputRef.current.click()} style={{ position: "absolute", top: 8, right: 8, background: "rgba(28,35,43,0.85)", color: "#fff", border: "none", borderRadius: 6, padding: "5px 9px", fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
            <Camera size={13} /> Trocar foto
          </button>
        </div>
      ) : (
        <button onClick={() => inputRef.current.click()} style={{
          width: "100%", padding: "28px 12px", borderRadius: 10, border: `2px dashed ${T.line}`,
          background: "#F7F9FA", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, cursor: "pointer",
        }}>
          <Camera size={26} color={T.orange} />
          <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 600, fontSize: 13.5, color: T.ink }}>Fotografar a placa do caminhão</span>
          <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, color: T.inkSoft }}>Toque para abrir a câmera</span>
        </button>
      )}
      <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{ display: "none" }} />
    </div>
  );
}

/* =================================================================
   MAIN APP
==================================================================*/
function App() {
  const [db, setDb] = useState(null);
  const [session, setSession] = useState(null);
  const [booting, setBooting] = useState(true);
  const [view, setView] = useState("list");
  const [selectedId, setSelectedId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [step, setStep] = useState(0);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const [tab, setTab] = useState("rd");

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 5200); };

  const loadAll = async () => {
    const b = await api("/bootstrap");
    setSession(b.session);
    setDb({ reports: b.reports, people: b.people, placas: b.placas, settings: b.settings || null, nextNumero: b.nextNumero, catalogo: b.catalogo || { equipamentos: [], tipos: [], codigos: [] }, versoesPreco: b.versoesPreco || [], feriados: b.feriados || [] });
    return b;
  };
  const handleErr = (e) => {
    if (e && e.status === 401) { setSession(null); setDb(null); setView("list"); showToast("Sessão expirada. Entre novamente."); }
    else showToast((e && e.message) || "Erro inesperado.");
  };

  useEffect(() => { loadAll().catch(() => {}).finally(() => setBooting(false)); }, []);

  // atualização automática da lista (outras pessoas criam/assinam em outros aparelhos)
  useEffect(() => {
    if (!session) return;
    if (view !== "list" && view !== "detail") return;
    const t = setInterval(() => { loadAll().catch((e) => { if (e.status === 401) handleErr(e); }); }, 30000);
    return () => clearInterval(t);
  }, [session, view]);

  if (booting) {
    return (
      <div style={{ textAlign: "center", padding: 60, color: T.inkSoft, fontFamily: "Segoe UI, Selawik, Arial, sans-serif" }}>
        <RefreshCw size={20} className="animate-spin" style={{ marginBottom: 8 }} />
        <div>Carregando…</div>
      </div>
    );
  }

  const handleLogin = async (s) => {
    setSession(s);
    setTab(s.role === "coordenacao" ? "go" : (tab === "go" && !MEDICAO_ROLES.includes(s.role) ? "rd" : tab));
    try { await loadAll(); setView("list"); showToast(`Bem-vindo, ${s.nome}.`); } catch (e) { handleErr(e); }
  };
  const handleLogout = async () => {
    try { await api("/logout", "POST", {}); } catch (e) {}
    setSession(null); setDb(null); setDraft(null); setView("list");
  };

  if (!session || !db) {
    return (
      <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", background: T.paper, minHeight: "100vh", color: T.ink }}>
        <style>{FONTS}</style>
        <Header session={null} onLogout={handleLogout} view="login" setView={setView} />
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "16px 14px 60px" }}>
          <TabBar tab={tab} setTab={setTab} />
          <LoginView onLogin={handleLogin} tab={tab} />
        </div>
        {toast && <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: T.ink, color: "#fff", padding: "11px 18px", borderRadius: 9, fontSize: 13.5, zIndex: 50 }}>{toast}</div>}
      </div>
    );
  }

  const reports = Object.values(db.reports).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const startNew = async () => {
    if (session.role !== "supervisor_empresa" && session.role !== "admin") {
      showToast("Somente o Supervisor da empresa cria relatórios. Você pode assinar os que foram indicados a você.");
      return;
    }
    try {
      const b = await loadAll();
      const eu = session.role === "supervisor_empresa" ? (b.people.find((x) => x.id === session.personId) || null) : null;
      setDraft({ ...blankReport(b.nextNumero), empresa: eu ? (eu.empresa || "") : "",
        responsaveis: eu ? { supervisor_empresa: { id: eu.id, nome: eu.nome, matricula: eu.matricula, email: eu.email || "" } } : {} });
      setStep(0);
      setView("new");
    } catch (e) { handleErr(e); }
  };

  const saveDraftAsSubmitted = async () => {
    setSaving(true);
    try {
      if (draft.editId) {
        const upd = await api(`/reports/${draft.editId}`, "PUT", draft);
        await loadAll();
        setDraft(null); setSelectedId(upd.id); setView("detail");
        showToast("Relatório corrigido. As assinaturas foram mantidas e a alteração ficou no histórico.");
      } else {
        await api("/reports", "POST", draft);
        await loadAll();
        setDraft(null);
        setView("list");
        showToast("Relatório enviado para aprovação.");
      }
    } catch (e) { handleErr(e); }
    setSaving(false);
  };

  const startEdit = (r) => {
    setDraft({ ...blankReport(r.numero), ...JSON.parse(JSON.stringify(r)), editId: r.id, motivoEdicao: "",
      mobilizacao: r.mobilizacao || {}, equipamento: r.equipamento || "" });
    setStep(0); setView("new");
  };
  const openDetail = (id) => { setSelectedId(id); setView("detail"); };

  const signStage = async (report, stageKey, signatureImg) => {
    const stageIdx = STAGES.findIndex((s) => s.key === stageKey);
    const isFinal = stageIdx + 1 >= STAGES.length;
    const assigned = report.responsaveis[stageKey] || {};
    let pdfB64 = null;
    if (isFinal) {
      try {
        const preview = { ...report, stageIndex: stageIdx + 1, assinaturas: { ...report.assinaturas, [stageKey]: { nome: assigned.nome, matricula: assigned.matricula, dataHora: new Date().toISOString(), assinatura: signatureImg } } };
        pdfB64 = pdfToBase64(await buildReportPDF(preview));
      } catch (e) { console.error("Falha ao gerar PDF", e); }
    }
    let updated;
    try {
      updated = await api(`/reports/${report.id}/sign`, "POST", { stageKey, assinatura: signatureImg, pdf: pdfB64 });
    } catch (e) { handleErr(e); await loadAll().catch(() => {}); return; }
    setDb((cur) => ({ ...cur, reports: { ...cur.reports, [updated.id]: updated } }));

    if (isFinal) {
      try {
        const doc = await buildReportPDF(updated);
        doc.save(pdfFileName(updated));
      } catch (e) { console.error("Falha ao gerar PDF", e); }
      if (updated.emailStatus === "enviado") showToast("Concluído! PDF baixado e e-mail enviado com o PDF em anexo.");
      else if (updated.emailStatus === "simulado") showToast("Concluído! PDF baixado. O envio de e-mail ainda não está configurado no servidor (SMTP).");
      else showToast(`Concluído e PDF baixado, mas o e-mail falhou: ${updated.emailError || "erro desconhecido"}`);
    } else {
      showToast(`Assinado. Próxima etapa: ${stageLabel(STAGES[stageIdx + 1], updated)}.`);
    }
  };

  const admin = async (fn, okMsg) => {
    try { await fn(); await loadAll(); if (okMsg) showToast(okMsg); } catch (e) { handleErr(e); }
  };
  const addPerson = (p) => admin(() => api("/people", "POST", p), "Pessoa cadastrada.");
  const editPerson = (id, p) => admin(() => api(`/people/${id}`, "PUT", p), "Cadastro atualizado.");
  const removePerson = (id) => admin(() => api(`/people/${id}`, "DELETE"), "Pessoa removida.");
  const resetPassword = (id, senha) => admin(() => api(`/people/${id}/password`, "PUT", { senha }), "Senha redefinida.");
  const addPlaca = (pl) => admin(() => api("/placas", "POST", pl), "Placa cadastrada.");
  const removePlaca = (id) => admin(() => api(`/placas/${id}`, "DELETE"), "Placa removida.");
  const savePlacaTipo = (id, tipo) => admin(() => api(`/placas/${id}`, "PUT", { tipo }), "Equipamento da placa atualizado.");
  const savePrecos = async (body) => {
    try { await api("/precos", "POST", body); await loadAll(); showToast("Nova tabela de preços salva. Relatórios antigos mantêm o preço da época."); return true; }
    catch (e) {
      if (e.status === 409 && window.confirm(e.message + "\n\nAplicar mesmo assim?")) return savePrecos({ ...body, confirmarRetroativo: true });
      handleErr(e); return false;
    }
  };
  const editPrecoDatas = (id, body) => admin(() => api(`/precos/${id}`, "PUT", body), "Datas da tabela atualizadas.");
  const deletePreco = async (id) => {
    try { await api(`/precos/${id}`, "DELETE"); }
    catch (e) {
      if (e.status === 409 && window.confirm(e.message + "\n\nApagar mesmo assim?")) { try { await api(`/precos/${id}?confirmar=1`, "DELETE"); } catch (e2) { handleErr(e2); return; } }
      else { if (e.status !== 409) handleErr(e); return; }
    }
    await loadAll().catch(() => {}); showToast("Tabela de preços apagada.");
  };
  const saveFeriados = (lista) => admin(() => api("/feriados", "PUT", { feriados: lista }), "Feriados salvos.");
  const saveSettings = (cfg) => admin(() => api("/settings", "PUT", cfg), "Configuração salva.");

  const selectedReport = reports.find((r) => r.id === selectedId);

  return (
    <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", background: T.paper, minHeight: "100vh", color: T.ink }}>
      <style>{FONTS}</style>
      <Header session={session} onLogout={handleLogout} view={view} setView={setView} />

      <div style={{ maxWidth: 640, margin: "0 auto", padding: "16px 14px 60px" }}>
        {view === "list" && <TabBar tab={tab} setTab={(t) => { if (t === "go" && !MEDICAO_ROLES.includes(session.role)) { showToast("Gestão Operacional é restrita à Cenibra (coordenações, operadores e supervisores)."); return; } setTab(t); }} />}
        {view === "list" && tab === "go" && MEDICAO_ROLES.includes(session.role) ? (
          <GestaoView session={session} reports={reports} catalogo={db.catalogo} onOpen={openDetail} onRefresh={() => loadAll().then(() => showToast("Lista atualizada.")).catch(handleErr)} onErr={handleErr} onToast={showToast} />
        ) : view === "list" ? (
          <ListView reports={reports} onOpen={openDetail} onNew={startNew} onRefresh={() => loadAll().then(() => showToast("Lista atualizada.")).catch(handleErr)} session={session} />
        ) : view === "new" && draft ? (
          <NewReportWizard
            draft={draft} setDraft={setDraft} step={step} setStep={setStep} people={db.people} placas={db.placas} catalogo={db.catalogo} session={session}
            onCancel={() => { setDraft(null); setView("list"); }}
            onSubmit={saveDraftAsSubmitted} saving={saving}
          />
        ) : view === "detail" && selectedReport ? (
          <DetailView report={selectedReport} session={session} onBack={() => setView("list")} onSign={signStage} onEdit={startEdit} catalogo={db.catalogo} />
        ) : view === "admin" && session.role === "admin" ? (
          <AdminView
            db={db} onAddPerson={addPerson} onEditPerson={editPerson} onRemovePerson={removePerson} onResetPassword={resetPassword}
            onAddPlaca={addPlaca} onRemovePlaca={removePlaca} onPlacaTipo={savePlacaTipo} onSavePrecos={savePrecos} onEditPrecoDatas={editPrecoDatas} onDeletePreco={deletePreco} onSaveFeriados={saveFeriados} onOpen={openDetail} onErr={handleErr}
            onSaveSettings={saveSettings} onToast={showToast} onBack={() => setView("list")}
            onExport={() => exportCSV(reports)}
          />
        ) : (
          <div style={{ textAlign: "center", padding: 40, color: T.inkSoft }}>Nada para mostrar.</div>
        )}
      </div>

      {toast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: T.ink, color: "#fff", padding: "11px 18px", borderRadius: 9,
          fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 13.5, fontWeight: 500, boxShadow: "0 8px 24px rgba(0,0,0,.25)",
          maxWidth: "92%", textAlign: "center", zIndex: 50,
        }}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Login view
----------------------------------------------------------------*/
function LoginView({ onLogin, tab }) {
  const [matricula, setMatricula] = useState("");
  const [senha, setSenha] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setErr("");
    try {
      const sess = await api("/login", "POST", { matricula: matricula.trim(), senha });
      await onLogin(sess);
    } catch (e) { setErr(e.message || "Falha no login."); }
    setBusy(false);
  };

  return (
    <form onSubmit={(e) => { e.preventDefault(); if (matricula && senha && !busy) submit(); }} style={{ background: T.card, borderRadius: 14, border: `1px solid ${T.line}`, padding: 18 }}>
      <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 19, fontWeight: 600, marginBottom: 4 }}>Entrar — {tab === "go" ? "Gestão Operacional" : "Relatório Diário de Hidrojato"}</div>
      <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12.5, color: T.inkSoft, marginBottom: 14 }}>{tab === "go" ? "Acesso das coordenações Cenibra (usuário = DEFAB-F, DEFAB-S…), operadores e supervisores Cenibra." : "Use sua matrícula e senha. Se ainda não tem acesso, peça ao administrador."}</div>
      <Field label="Matrícula"><TextInput value={matricula} onChange={(e) => { setMatricula(e.target.value); setErr(""); }} autoComplete="username" autoCapitalize="characters" /></Field>
      <Field label="Senha"><TextInput type="password" value={senha} onChange={(e) => { setSenha(e.target.value); setErr(""); }} placeholder="••••" autoComplete="current-password" /></Field>
      {err && <div style={{ color: T.danger, fontSize: 12.5, marginBottom: 10 }}>{err}</div>}
      <Btn type="submit" onClick={() => {}} disabled={!matricula || !senha || busy}><LogIn size={14} /> {busy ? "Entrando…" : "Entrar"}</Btn>
    </form>
  );
}

function PendenciasPanel({ reports, session, onOpen }) {
  const pend = reports.filter((r) => r.stageIndex < STAGES.length);
  if (pend.length === 0) return null;
  const minhas = pend.filter((r) => { const st = STAGES[r.stageIndex]; const a = st && r.responsaveis && r.responsaveis[st.key]; return a && a.id === session.personId; });
  const porEtapa = STAGES.map((st, i) => ({ st, n: pend.filter((r) => r.stageIndex === i).length })).filter((x) => x.n > 0);
  return (
    <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 12, padding: 12, marginBottom: 14 }}>
      <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 8 }}>Pendências de assinatura ({pend.length})</div>
      {minhas.length > 0 && (
        <div style={{ background: T.amberSoft, borderRadius: 8, padding: "8px 10px", marginBottom: 8 }}>
          <div style={{ fontWeight: 700, fontSize: 12.5, color: T.amber, marginBottom: 4 }}>Aguardando a sua assinatura ({minhas.length})</div>
          {minhas.map((r) => (
            <button key={r.id} onClick={() => onOpen(r.id)} style={{ display: "block", width: "100%", textAlign: "left", background: "#fff", border: `1px solid ${T.line}`, borderRadius: 8, padding: "7px 10px", marginTop: 4, cursor: "pointer", fontSize: 12.5 }}>
              <b>Nº {r.numero}</b> · {r.placaTag} · {r.coordenacao} · {r.data ? new Date(r.data + "T00:00").toLocaleDateString("pt-BR") : ""} — <span style={{ color: T.orange, fontWeight: 700 }}>Assinar</span>
            </button>
          ))}
        </div>
      )}
      <div className="flex flex-wrap gap-2">
        {porEtapa.map(({ st, n }) => (
          <span key={st.key} style={{ background: "#F2F4F5", borderRadius: 16, padding: "4px 10px", fontSize: 12 }}>
            Falta <b>{st.label}</b>: {n}
          </span>
        ))}
      </div>
    </div>
  );
}

          <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, color: T.inkSoft }}>{reports.length} registrado{reports.length !== 1 ? "s" : ""}</div>

        <div className="flex gap-2">
          <Btn variant="ghost" onClick={onRefresh}><RefreshCw size={15} /></Btn>

      <PendenciasPanel reports={reports} session={session} onOpen={onOpen} />

      {reports.length === 0 && (
        <div style={{ background: T.card, borderRadius: 12, padding: "36px 20px", textAlign: "center", border: `1px solid ${T.line}` }}>
          <FileText size={26} color={T.inkSoft} style={{ marginBottom: 8 }} />
          <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 600, color: T.ink, marginBottom: 4 }}>Nenhum relatório ainda</div>
          <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 13, color: T.inkSoft }}>Toque em "Novo" para preencher o primeiro relatório de serviço.</div>
        </div>
      )}

      <div className="flex flex-col gap-2.5">
        {reports.map((r) => (
          <button key={r.id} onClick={() => onOpen(r.id)} style={{
            textAlign: "left", background: T.card, border: `1px solid ${T.line}`, borderRadius: 12,
            padding: "13px 14px", display: "flex", flexDirection: "column", gap: 6, cursor: "pointer",
          }}>
            <div className="flex items-center justify-between">
              <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 600, fontSize: 12.5, color: T.orangeDeep }}>Nº {r.numero} · {r.empresa || "—"} · {r.coordenacao || "—"}</span>
              <StatusChip stageIndex={r.stageIndex} report={r} />
            </div>
            <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 700, fontSize: 15.5, color: T.ink }}>{r.placaTag || "Placa não informada"}</div>
            <div className="flex items-center gap-3" style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, color: T.inkSoft }}>
              <span>Cenibra</span>
              <span>·</span>
              <span>{r.data ? new Date(r.data + "T00:00").toLocaleDateString("pt-BR") : "—"}</span>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

const STEP_LABELS = ["Dados gerais", "Horários", "Equipe responsável", "Foto da placa", "Revisão"];

function ResponsavelPicker({ label, list, value, onChange }) {
  const selected = list.find((p) => p.id === value);
  return (
    <div style={{ marginBottom: 14 }}>
      <Field label={label} required>
        <select value={value || ""} onChange={(e) => onChange(e.target.value)} style={inputStyle}>
          <option value="">Selecione…</option>
          {list.map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
      </Field>
      {selected && (
        <div style={{ fontSize: 12, color: T.inkSoft, marginTop: -6 }}>
          Matrícula: <b style={{ color: T.ink }}>{selected.matricula}</b> · {selected.email}
        </div>
      )}
      {list.length === 0 && (
        <div style={{ fontSize: 11.5, color: T.danger, marginTop: -6 }}>
          Nenhuma pessoa cadastrada para este perfil. Cadastre em Administração → Gerenciar pessoas.
        </div>
      )}
    </div>
  );
}

function EquipeCampoPicker({ selected, onAdd, onRemove }) {
  const [nome, setNome] = useState("");
  const add = () => { const n = nome.trim(); if (!n) return; onAdd({ id: uid(), nome: n, matricula: "" }); setNome(""); };
  return (
    <div style={{ marginBottom: 16 }}>
      <Field label="Equipe do turno (opcional)" hint="Digite o nome de quem trabalhou e toque em +">
        <div className="flex gap-2">
          <TextInput value={nome} onChange={(e) => setNome(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } }} placeholder="Nome do funcionário" />
          <Btn variant="ghost" onClick={add} disabled={!nome.trim()}><Plus size={15} /></Btn>
        </div>
      </Field>
      {selected.length > 0 && (
        <div style={{ background: "#F7F9FA", borderRadius: 8, padding: "6px 10px" }}>
          {selected.map((m) => (
            <div key={m.id} className="flex items-center justify-between" style={{ padding: "6px 0", borderBottom: `1px solid ${T.line}` }}>
              <span style={{ fontSize: 13 }}>{m.nome}</span>
              <button onClick={() => onRemove(m.id)} style={{ background: "none", border: "none", color: T.danger, cursor: "pointer" }}><Trash2 size={14} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function NewReportWizard({ draft, setDraft, step, setStep, people, placas, catalogo, session, onCancel, onSubmit, saving }) {
  const souSupervisor = !!(session && session.role === "supervisor_empresa");
  const set = (patch) => setDraft({ ...draft, ...patch });

  const cat = { modalidades: [], ...(catalogo || { equipamentos: [], tipos: [] }) };
  window.__setDraftMotivo = (v) => set({ motivoEdicao: v });

  const updateRegistro = (id, patch) => {
    set({ registros: draft.registros.map((r) => (r.id === id ? { ...r, ...patch } : r)) });
  };
  const addRegistro = () => set({ registros: [...draft.registros, { id: uid(), inicio: "", fim: "", servicos: "", area: "", areaOutra: "", tipo: "trabalhada", qtd: 1 }] });
  const removeRegistro = (id) => set({ registros: draft.registros.filter((r) => r.id !== id) });

  const setResponsavel = (key, personId, list) => {
    const p = list.find((pp) => pp.id === personId);
    set({ responsaveis: { ...draft.responsaveis, [key]: p ? { id: p.id, nome: p.nome, matricula: p.matricula, email: p.email } : null } });
  };

  const listSupervisorEmpresa = people.filter((p) => p.role === "supervisor_empresa" && p.empresa === draft.empresa);
  const listOperadorCenibra = people.filter((p) => p.role === "cenibra_operador" && (p.coordenacoes || []).includes(draft.coordenacao));
  const listSupervisorCenibra = people.filter((p) => p.role === "cenibra_supervisor" && (p.coordenacoes || []).includes(draft.coordenacao));

  const canNext = step === 0 ? !!(draft.empresa && draft.coordenacao && draft.placaTag && draft.data && draft.equipamento && draft.modalidade)
    : step === 2 ? !!(draft.responsaveis.supervisor_empresa && draft.responsaveis.cenibra_operador && draft.responsaveis.cenibra_supervisor)
    : step === 3 ? !!draft.fotoPlaca
    : true;

  return (
    <div>
      <div style={{ background: T.card, borderRadius: 14, border: `1px solid ${T.line}`, overflow: "hidden" }}>
        <div style={{ padding: "14px 16px 0" }}>
          <div className="flex items-center justify-between" style={{ marginBottom: 10 }}>
            <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 17, fontWeight: 600 }}>{draft.editId ? "Corrigir relatório" : "Novo relatório"}</span>
            <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, color: T.orangeDeep, fontWeight: 600 }}>Nº {draft.numero}</span>
          </div>
          <div className="flex gap-1" style={{ marginBottom: 14 }}>
            {STEP_LABELS.map((l, i) => (
              <div key={l} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= step ? T.orange : T.line }} />
            ))}
          </div>
        </div>

        <div style={{ padding: "0 16px 18px" }}>
          <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, fontWeight: 700, color: T.inkSoft, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 10 }}>
            {String(step + 1).padStart(2, "0")} · {STEP_LABELS[step]}
          </div>

          {step === 0 && (
            <div>
              <Field label="Empresa de Hidrojato" required hint="Primeira informação a escolher">
                <select value={draft.empresa} disabled={souSupervisor} onChange={(e) => set({ empresa: e.target.value, placaTag: "" })} style={inputStyle}>
                  <option value="">Selecione…</option>
                  {EMPRESAS.map((e) => <option key={e} value={e}>{e}</option>)}
                </select>
              </Field>
              <Field label="Coordenação (DEFAB)" required>
                <select value={draft.coordenacao} onChange={(e) => set({ coordenacao: e.target.value })} style={inputStyle}>
                  <option value="">Selecione…</option>
                  {COORDENACOES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </Field>
              <Field label="Cliente">
                <div style={{ ...inputStyle, background: "#F2F4F5", color: T.inkSoft, display: "flex", alignItems: "center" }}>Cenibra (fábrica — fixo)</div>
              </Field>
              <Field label="Placa / Tag" required hint={!draft.empresa ? "Escolha a empresa primeiro" : undefined}>
                {(() => {
                  const placasEmpresa = (placas || []).filter((p) => p.empresa === draft.empresa);
                  return (
                    <select value={draft.placaTag} onChange={(e) => { const pl = (placas || []).find((x) => x.empresa === draft.empresa && x.placa === e.target.value); set({ placaTag: e.target.value, equipamento: (pl && pl.tipo) || draft.equipamento }); }} style={inputStyle} disabled={!draft.empresa}>
                      <option value="">{draft.empresa ? "Selecione a placa…" : "Escolha a empresa primeiro"}</option>
                      {placasEmpresa.map((p) => <option key={p.id} value={p.placa}>{p.placa}</option>)}
                    </select>
                  );
                })()}
                {(() => {
                  const sel = (placas || []).find((p) => p.empresa === draft.empresa && p.placa === draft.placaTag);
                  return sel && sel.foto ? (
                    <div style={{ marginTop: 8 }}>
                      <img src={sel.foto} alt={sel.placa} style={{ width: "100%", maxHeight: 150, objectFit: "cover", borderRadius: 8, border: `1px solid ${T.line}` }} />
                      <div style={{ fontSize: 11, color: T.inkSoft, marginTop: 3 }}>Foto de referência do veículo cadastrado</div>
                    </div>
                  ) : null;
                })()}
                {draft.empresa && (placas || []).filter((p) => p.empresa === draft.empresa).length === 0 && (
                  <div style={{ fontSize: 11.5, color: T.danger, marginTop: 4 }}>
                    Nenhuma placa cadastrada para {draft.empresa}. Cadastre em Administração → Gerenciar placas.
                  </div>
                )}
              </Field>
              <Field label="Data" required>
                <TextInput type="date" value={draft.data} onChange={(e) => set({ data: e.target.value })} />
              </Field>
              <Field label="Tipo de serviço" required>
                <div className="flex gap-2 flex-wrap">
                  {cat.modalidades.map((q) => (
                    <button key={q.key} type="button" onClick={() => set({ modalidade: q.key })} style={{
                      padding: "8px 12px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
                      border: `1.5px solid ${draft.modalidade === q.key ? T.orange : T.line}`,
                      background: draft.modalidade === q.key ? T.orange : "#fff", color: draft.modalidade === q.key ? "#fff" : T.ink,
                    }}>{q.nome}</button>
                  ))}
                </div>
              </Field>
              <Field label="Serviço emergencial?" hint="Convocação com atendimento em até 24h. No contrato, muda o preço de mobilização/desmobilização.">
                <div className="flex gap-2">
                  {[[false, "Não"], [true, "Sim, emergencial"]].map(([v, l]) => (
                    <button key={l} type="button" onClick={() => set({ emergencial: v })} style={{
                      padding: "8px 14px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
                      border: `1.5px solid ${draft.emergencial === v ? (v ? T.danger : T.teal) : T.line}`,
                      background: draft.emergencial === v ? (v ? T.danger : T.teal) : "#fff", color: draft.emergencial === v ? "#fff" : T.ink,
                    }}>{l}</button>
                  ))}
                </div>
              </Field>
              <Field label="Equipamento do contrato" required hint="Já vem preenchido pela placa; confira. É o que define o preço na medição.">
                <select value={draft.equipamento || ""} onChange={(e) => set({ equipamento: e.target.value })} style={inputStyle}>
                  <option value="">Selecione…</option>
                  {cat.equipamentos.map((q) => <option key={q.key} value={q.key}>{q.nome}</option>)}
                </select>
              </Field>
            </div>
          )}

          {step === 1 && (
            <div>
              {draft.registros.map((r, idx) => {
                const horas = registroHoras(r);
                const invalid = r.inicio && r.fim && horas == null;
                return (
                  <div key={r.id} style={{ border: `1px solid ${invalid ? T.danger : T.line}`, borderRadius: 10, padding: 12, marginBottom: 10, position: "relative" }}>
                    <div className="flex items-center justify-between" style={{ marginBottom: 8 }}>
                      <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, color: T.inkSoft, fontWeight: 600 }}>REGISTRO {idx + 1}</span>
                      {draft.registros.length > 1 && (
                        <button onClick={() => removeRegistro(r.id)} style={{ color: T.danger, background: "none", border: "none", cursor: "pointer" }}><Trash2 size={15} /></button>
                      )}
                    </div>
                    <div className="flex gap-2" style={{ marginBottom: 4 }}>
                      <div style={{ flex: 1 }}>
                        <Field label="Início (data e hora)"><TextInput type="datetime-local" value={r.inicio} onChange={(e) => updateRegistro(r.id, { inicio: e.target.value })} /></Field>
                      </div>
                      <div style={{ flex: 1 }}>
                        <Field label="Fim (data e hora)"><TextInput type="datetime-local" value={r.fim} onChange={(e) => updateRegistro(r.id, { fim: e.target.value })} /></Field>
                      </div>
                    </div>
                    {invalid && <div style={{ fontSize: 11.5, color: T.danger, marginBottom: 8 }}>Verifique as datas: o fim precisa ser depois do início.</div>}
                    <Field label="Serviços executados">
                      <TextArea rows={2} value={r.servicos} onChange={(e) => updateRegistro(r.id, { servicos: e.target.value })} placeholder="Descreva a atividade realizada" />
                    </Field>
                    <Field label="Tipo de atividade" required hint="Mobilização/desmobilização também se registra aqui (informe o horário em que ocorreu).">
                      <select value={r.tipo || "trabalhada"} onChange={(e) => updateRegistro(r.id, { tipo: e.target.value })} style={inputStyle}>
                        {cat.tipos.filter((q) => !q.key.startsWith("revesa") || draft.equipamento === "bomba20_2").map((q) => <option key={q.key} value={q.key}>{q.nome}</option>)}
                      </select>
                    </Field>
                    {(r.tipo === "revesa_mob" || r.tipo === "revesa_desmob") && (
                      <Field label="Nº de pessoas (revesa)"><TextInput type="number" min="1" max="20" value={r.qtd || 1} onChange={(e) => updateRegistro(r.id, { qtd: e.target.value })} /></Field>
                    )}
                    <Field label="Área">
                      <select value={r.area} onChange={(e) => updateRegistro(r.id, { area: e.target.value })} style={inputStyle}>
                        <option value="">Selecione…</option>
                        {AREAS.map((a) => <option key={a} value={a}>{a}</option>)}
                      </select>
                    </Field>
                    {r.area === "Outra (especificar)" && (
                      <Field label="Especifique a área">
                        <TextInput value={r.areaOutra} onChange={(e) => updateRegistro(r.id, { areaOutra: e.target.value })} placeholder="Nome da área" />
                      </Field>
                    )}
                  </div>
                );
              })}
              <Btn variant="ghost" onClick={addRegistro}><Plus size={15} /> Adicionar registro</Btn>
            </div>
          )}

          {step === 2 && (
            <div>
              {!draft.empresa && (
                <div style={{ fontSize: 12.5, color: T.danger, marginBottom: 10 }}>Volte ao passo 1 e selecione a empresa de hidrojato antes de escolher a equipe.</div>
              )}
              <EquipeCampoPicker selected={draft.equipeCampo} onAdd={(m) => set({ equipeCampo: [...draft.equipeCampo, m] })} onRemove={(id) => set({ equipeCampo: draft.equipeCampo.filter((m) => m.id !== id) })} />
              {souSupervisor ? (
                <Field label={`Supervisor ${draft.empresa || "da Empresa"} (você)`} hint="Você preenche o relatório e é o primeiro a assinar.">
                  <div style={{ ...inputStyle, background: "#F2F4F5", color: T.inkSoft }}>{(draft.responsaveis.supervisor_empresa || {}).nome || session.nome}</div>
                </Field>
              ) : (
                <ResponsavelPicker label={`Supervisor ${draft.empresa || "da Empresa"}`} list={listSupervisorEmpresa} value={draft.responsaveis.supervisor_empresa && draft.responsaveis.supervisor_empresa.id} onChange={(id) => setResponsavel("supervisor_empresa", id, listSupervisorEmpresa)} />
              )}
              <ResponsavelPicker label="Operador Responsável CENIBRA" list={listOperadorCenibra} value={draft.responsaveis.cenibra_operador && draft.responsaveis.cenibra_operador.id} onChange={(id) => setResponsavel("cenibra_operador", id, listOperadorCenibra)} />
              <ResponsavelPicker label="Supervisor Operacional CENIBRA" list={listSupervisorCenibra} value={draft.responsaveis.cenibra_supervisor && draft.responsaveis.cenibra_supervisor.id} onChange={(id) => setResponsavel("cenibra_supervisor", id, listSupervisorCenibra)} />
            </div>
          )}

          {step === 3 && (
            <div>
              <PhotoCapture value={draft.fotoPlaca} onChange={(v) => set({ fotoPlaca: v })} />
              <div style={{ marginTop: 10, fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, color: T.inkSoft }}>
                A foto da placa/tag é obrigatória antes de enviar para aprovação.
              </div>
            </div>
          )}

          {step === 4 && (
            <ReviewSummary draft={draft} catalogo={cat} />
          )}
        </div>
      </div>

      <div className="flex items-center justify-between" style={{ marginTop: 14 }}>
        <Btn variant="ghost" onClick={step === 0 ? onCancel : () => setStep(step - 1)}>
          <ChevronLeft size={16} /> {step === 0 ? "Cancelar" : "Voltar"}
        </Btn>
        {step < STEP_LABELS.length - 1 ? (
          <Btn onClick={() => canNext && setStep(step + 1)} disabled={!canNext}>Avançar <ChevronRight size={16} /></Btn>
        ) : (
          <Btn onClick={onSubmit} disabled={saving || (draft.editId && !(draft.motivoEdicao || "").trim())}><Send size={15} /> {saving ? "Enviando…" : (draft.editId ? "Salvar correção" : "Enviar para aprovação")}</Btn>
        )}
      </div>
    </div>
  );
}

function ClassPreview({ draft }) {
  const [res, setRes] = useState(null);
  useEffect(() => {
    api("/classificar", "POST", { registros: draft.registros }).then(setRes).catch(() => setRes(null));
  }, []);
  if (!res) return null;
  const T0 = res.totais || {};
  return (
    <div style={{ marginTop: 12, background: T.greenSoft, borderRadius: 8, padding: "9px 12px", fontSize: 12.5 }}>
      <div style={{ fontWeight: 700, color: T.green, marginBottom: 4 }}>Classificação para medição (horas)</div>
      <div>HN {T0.HN || 0} · HE {T0.HE || 0} · HD1 {T0.HD1 || 0} · HD2 {T0.HD2 || 0}</div>
      <div style={{ color: T.inkSoft, marginTop: 2 }}>HN = normal · HE = extra/domingo/feriado · HD = hora à disposição. Refeição e parada por quebra não são medidas.</div>
    </div>
  );
}

function ReviewSummary({ draft, catalogo }) {
  const resp = draft.responsaveis || {};
  const eqNome = ((catalogo && catalogo.equipamentos) || []).find((q) => q.key === draft.equipamento);
  return (
    <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 13.5, color: T.ink }}>
      <SummaryRow label="Empresa de Hidrojato" value={draft.empresa} />
      <SummaryRow label="Coordenação" value={draft.coordenacao} mono />
      <SummaryRow label="Cliente" value="Cenibra" />
      <SummaryRow label="Placa/Tag" value={draft.placaTag} mono />
      <SummaryRow label="Data" value={draft.data ? new Date(draft.data + "T00:00").toLocaleDateString("pt-BR") : "—"} />
      <SummaryRow label="Tipo de serviço" value={(((catalogo || {}).modalidades || []).find((q) => q.key === draft.modalidade) || {}).nome} />
      <SummaryRow label="Emergencial" value={draft.emergencial ? "SIM" : "Não"} />
      <SummaryRow label="Equipamento do contrato" value={eqNome ? eqNome.nome : "—"} />
      <ClassPreview draft={draft} />
      {draft.editId && (
        <div style={{ marginTop: 12 }}>
          <Field label="Motivo da correção" required hint="Fica registrado no histórico do relatório">
            <TextArea rows={2} value={draft.motivoEdicao || ""} onChange={(e) => window.__setDraftMotivo && window.__setDraftMotivo(e.target.value)} />
          </Field>
        </div>
      )}

      <div style={{ fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginTop: 12, marginBottom: 6 }}>REGISTROS / SERVIÇOS EXECUTADOS</div>
      {draft.registros.map((r, i) => (
        <div key={r.id} style={{ marginBottom: 8, paddingBottom: 8, borderBottom: `1px solid ${T.line}` }}>
          <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, color: T.teal, fontWeight: 700 }}>{fmtDateTimeShort(r.inicio)} → {fmtDateTimeShort(r.fim)}</div>
          <div style={{ fontSize: 13 }}>{r.servicos || "—"}</div>
          <div style={{ fontSize: 11.5, color: T.inkSoft }}>Área: {areaLabel(r)}</div>
        </div>
      ))}

      <div style={{ fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginTop: 12, marginBottom: 6 }}>EQUIPE DE CAMPO</div>
      <div style={{ marginBottom: 4 }}>{draft.equipeCampo.map((m) => m.nome).join(", ") || "—"}</div>

      <SummaryRow label={`Supervisor ${draft.empresa || ""}`} value={resp.supervisor_empresa ? resp.supervisor_empresa.nome : "—"} />
      <SummaryRow label="Operador Responsável CENIBRA" value={resp.cenibra_operador ? resp.cenibra_operador.nome : "—"} />
      <SummaryRow label="Supervisor Operacional CENIBRA" value={resp.cenibra_supervisor ? resp.cenibra_supervisor.nome : "—"} />
      {draft.fotoPlaca && (
        <div style={{ marginTop: 10 }}>
          <img src={draft.fotoPlaca} alt="Placa" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
        </div>
      )}
      <div style={{ marginTop: 12, background: T.amberSoft, borderRadius: 8, padding: "9px 12px", fontSize: 12.5, color: T.amber, fontWeight: 600 }}>
        Ao enviar, o relatório segue para assinatura do Supervisor da empresa → Operador CENIBRA → Supervisor Operacional CENIBRA. Ao concluir, um PDF é gerado e o e-mail é disparado automaticamente.
      </div>
    </div>
  );
}
function SummaryRow({ label, value, mono }) {
  return (
    <div className="flex items-start justify-between" style={{ padding: "7px 0", borderBottom: `1px solid ${T.line}` }}>
      <span style={{ color: T.inkSoft, fontWeight: 600 }}>{label}</span>
      <span style={{ textAlign: "right", maxWidth: "62%", fontFamily: "Segoe UI, Selawik, Arial, sans-serif" }}>{value || "—"}</span>
    </div>
  );
}

/* ---------------------------------------------------------------
   Detail view — read-only report + signature workflow
----------------------------------------------------------------*/
function DetailView({ report, session, onBack, onSign, onEdit, catalogo }) {
  const [signing, setSigning] = useState(false);
  const [sigImg, setSigImg] = useState(null);

  const currentStage = STAGES[report.stageIndex];
  const assigned = currentStage ? report.responsaveis[currentStage.key] : null;
  const canActOnCurrent = !!(currentStage && assigned && session && session.personId === assigned.id);

  const confirmSign = async () => {
    if (!sigImg) return;
    await onSign(report, currentStage.key, sigImg);
    setSigning(false); setSigImg(null);
  };

  const downloadPDF = async () => {
    try {
      const doc = await buildReportPDF(report);
      doc.save(pdfFileName(report));
    } catch (e) { console.error(e); }
  };

  return (
    <div>
      <div style={{ background: T.card, borderRadius: 14, border: `1px solid ${T.line}`, padding: 16, marginBottom: 14 }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 4 }}>
          <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12.5, color: T.orangeDeep, fontWeight: 700 }}>Nº {report.numero} · {report.empresa} · {report.coordenacao}</span>
          <StatusChip stageIndex={report.stageIndex} report={report} />
        </div>
        <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 20, fontWeight: 600, marginBottom: 2 }}>{report.placaTag}</div>
        <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>Cliente: Cenibra</div>
        <div style={{ marginBottom: 14 }}><StageTracker stageIndex={report.stageIndex} report={report} /></div>

        <SummaryRow label="Data" value={new Date(report.data + "T00:00").toLocaleDateString("pt-BR")} />
        <SummaryRow label="Tipo de serviço" value={((((catalogo || {}).modalidades) || []).find((q) => q.key === report.modalidade) || {}).nome} />
        <SummaryRow label="Emergencial" value={report.emergencial ? "SIM" : "Não"} />
        <SummaryRow label="Equipamento do contrato" value={(report.equipamentos || []).join(", ")} />
        {session && session.role === "admin" && (
          <Btn variant="ghost" style={{ marginTop: 12, marginRight: 8 }} onClick={() => { onEdit(report); }}>Editar relatório (ADM)</Btn>
        )}

        <Btn variant="ghost" style={{ marginTop: 12 }} onClick={downloadPDF}><FilePdf size={15} /> Baixar PDF</Btn>
      </div>

      {(report.revisoes || []).length > 0 && (
        <div style={{ background: T.amberSoft, color: T.amber, borderRadius: 10, padding: "10px 12px", marginBottom: 14, fontSize: 12.5 }}>
          <b>Relatório corrigido {report.revisoes.length}×.</b>
          {report.revisoes.map((v) => (
            <div key={v.n} style={{ marginTop: 3 }}>#{v.n} · {new Date(v.em).toLocaleString("pt-BR")} · {v.por && v.por.nome} — {v.motivo || "sem motivo"}
              {(v.antes.assinaturasMantidas || []).length > 0 && <> (assinaturas mantidas: {v.antes.assinaturasMantidas.map((a) => a.nome).join(", ")})</>}
              {(v.alteracoes || []).length > 0 && (
                <div style={{ background: "#fff", color: T.ink, borderRadius: 6, padding: "6px 8px", marginTop: 4, fontSize: 12 }}>
                  {v.alteracoes.map((a, i) => (
                    <div key={i} style={{ marginBottom: 3 }}><b>{a.campo}:</b> <span style={{ color: T.danger, textDecoration: "line-through" }}>{a.de}</span> → <span style={{ color: T.green, fontWeight: 600 }}>{a.para}</span></div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
      <Section title="Registros de horário e serviços" icon={<Clock size={14} />}>
        {report.registros.map((r, i) => (
          <div key={r.id} style={{ padding: "9px 0", borderBottom: i < report.registros.length - 1 ? `1px solid ${T.line}` : "none" }}>
            <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, fontWeight: 700, color: T.teal }}>{fmtDateTimeShort(r.inicio)} → {fmtDateTimeShort(r.fim)}</div>
            <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 13, marginTop: 2 }}>{r.servicos || "—"}</div>
            <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, color: T.inkSoft }}>Área: {areaLabel(r)}{r.tipo ? " · " + ((((catalogo || {}).tipos || []).find((q) => q.key === r.tipo) || {}).nome || r.tipo) : ""}</div>
          </div>
        ))}
      </Section>

      <Section title="Equipe de campo" icon={<Users size={14} />}>
        {(report.equipeCampo || []).length === 0 ? (
          <div style={{ fontSize: 13, color: T.inkSoft }}>Equipe não informada.</div>
        ) : report.equipeCampo.map((m) => (
          <div key={m.id} className="flex justify-between" style={{ padding: "5px 0", fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 13.5 }}>
            <span>{m.nome}</span>
            <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, color: T.inkSoft }}>{m.matricula}</span>
          </div>
        ))}
      </Section>

      <Section title="Equipe responsável" icon={<Users size={14} />}>
        {STAGES.map((s) => {
          const p = report.responsaveis[s.key];
          return (
            <div key={s.key} className="flex items-center justify-between" style={{ padding: "6px 0", fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 13 }}>
              <span style={{ color: T.inkSoft }}>{stageLabel(s, report)}</span>
              <span style={{ fontWeight: 600 }}>{p ? `${p.nome} (mat. ${p.matricula})` : "—"}</span>
            </div>
          );
        })}
      </Section>

      {report.fotoPlaca && (
        <Section title="Foto da placa" icon={<Camera size={14} />}>
          <img src={report.fotoPlaca} alt="Placa do caminhão" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
        </Section>
      )}

      <Section title="Assinaturas" icon={<PenLine size={14} />}>
        {STAGES.map((s, i) => {
          const sig = report.assinaturas[s.key];
          const isCurrent = i === report.stageIndex;
          const stageAssigned = report.responsaveis[s.key];
          return (
            <div key={s.key} style={{ padding: "10px 0", borderBottom: i < STAGES.length - 1 ? `1px solid ${T.line}` : "none" }}>
              <div className="flex items-center justify-between">
                <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 700, fontSize: 13 }}>{stageLabel(s, report)}</span>
                {sig ? <CircleCheck size={17} color={T.green} /> : isCurrent ? (
                  <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11, fontWeight: 700, color: T.orange }}>PENDENTE</span>
                ) : (
                  <span style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11, color: "#B0B8C1" }}>—</span>
                )}
              </div>
              {sig && (
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 6 }}>
                  <img src={sig.assinatura} alt="assinatura" style={{ height: 34, background: "#fff", border: `1px solid ${T.line}`, borderRadius: 4 }} />
                  <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12 }}>
                    <div style={{ fontWeight: 600 }}>{sig.nome} <span style={{ color: T.inkSoft, fontWeight: 400 }}>· mat. {sig.matricula}</span></div>
                    <div style={{ color: T.inkSoft, fontSize: 11 }}>{fmtDate(sig.dataHora)}</div>
                  </div>
                </div>
              )}
              {isCurrent && !sig && stageAssigned && canActOnCurrent && !signing && (
                <Btn variant="dark" style={{ marginTop: 8 }} onClick={() => setSigning(true)}><PenLine size={14} /> Assinar como {stageAssigned.nome}</Btn>
              )}
              {isCurrent && !sig && stageAssigned && canActOnCurrent && signing && (
                <div style={{ marginTop: 10, background: "#F7F9FA", borderRadius: 10, padding: 12 }}>
                  <Field label="Assinatura">
                    <SignaturePad onChange={setSigImg} />
                  </Field>
                  <div className="flex gap-2" style={{ marginTop: 8 }}>
                    <Btn variant="ghost" onClick={() => { setSigning(false); setSigImg(null); }}>Cancelar</Btn>
                    <Btn onClick={confirmSign} disabled={!sigImg}><Check size={15} /> Confirmar assinatura</Btn>
                  </div>
                </div>
              )}
              {isCurrent && !sig && !stageAssigned && (
                <div style={{ marginTop: 6, fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, color: T.danger }}>
                  Nenhuma pessoa designada para esta etapa neste relatório.
                </div>
              )}
              {isCurrent && !sig && stageAssigned && !canActOnCurrent && (
                <div style={{ marginTop: 6, fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12, color: T.inkSoft }}>
                  Aguardando: <b>{stageAssigned.nome}</b> (mat. {stageAssigned.matricula}).{" "}
                  Somente essa pessoa consegue assinar esta etapa, entrando com a própria matrícula.
                </div>
              )}
            </div>
          );
        })}
        {report.stageIndex >= STAGES.length && (
          <div style={{ marginTop: 10, background: T.greenSoft, borderRadius: 8, padding: "10px 12px", color: T.green, fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontWeight: 700, fontSize: 13 }}>
            <div className="flex items-center gap-2"><CircleCheck size={16} /> Relatório concluído.</div>
            <div style={{ fontWeight: 500, fontSize: 12, marginTop: 4, color: T.inkSoft }}>
              {report.emailStatus === "enviado" && <>E-mail enviado para: {(report.emailRecipients || []).join(", ")}</>}
              {report.emailStatus === "simulado" && <>(Simulação) PDF baixado automaticamente — seria o anexo. E-mail não configurado, destinatários que receberiam: {(report.emailRecipients || []).join(", ")}</>}
              {report.emailStatus === "erro" && <>Falha ao enviar e-mail: {report.emailError}</>}
            </div>
            <Btn variant="ghost" style={{ marginTop: 8 }} onClick={downloadPDF}><FilePdf size={14} /> Baixar PDF novamente</Btn>
          </div>
        )}
      </Section>
    </div>
  );
}

function Section({ title, icon, children }) {
  return (
    <div style={{ background: T.card, borderRadius: 14, border: `1px solid ${T.line}`, padding: 16, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 11.5, fontWeight: 700, color: T.inkSoft, letterSpacing: 0.4, textTransform: "uppercase", marginBottom: 10 }}>
        {icon} {title}
      </div>
      {children}
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin view — manage people + email config + CSV export
----------------------------------------------------------------*/
function AdminView({ db, onAddPerson, onEditPerson, onRemovePerson, onResetPassword, onAddPlaca, onRemovePlaca, onPlacaTipo, onSavePrecos, onEditPrecoDatas, onDeletePreco, onSaveFeriados, onOpen, onErr, onSaveSettings, onToast, onBack, onExport }) {
  const reportsList = Object.values(db.reports);
  const conflicts = findPlateConflicts(reportsList);
  return (
    <div>
      <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Administração</div>
      <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 12.5, color: T.inkSoft, marginBottom: 16 }}>
        Gerencie pessoas, placas, empresas/coordenações e o envio automático de e-mail.
      </div>

      <Section title="Exportar dados" icon={<Download size={14} />}>
        <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>Gera um CSV (uma linha por registro de horário) para abrir no Excel e montar o BI. As horas ficam calculadas aqui mesmo sem aparecer no relatório.</div>
        <Btn variant="ghost" onClick={onExport}><Download size={15} /> Exportar CSV</Btn>
      </Section>

      <Section title={`Auditoria de placas${conflicts.length ? ` (${conflicts.length})` : ""}`} icon={<RefreshCw size={14} />}>
        <PlateConflictAudit conflicts={conflicts} onOpen={onOpen} />
      </Section>

      <Section title="Gerenciar pessoas" icon={<Users size={14} />}>
        <PeopleManager people={db.people} onAdd={onAddPerson} onEdit={onEditPerson} onRemove={onRemovePerson} onReset={onResetPassword} />
      </Section>

      <Section title="Gerenciar placas" icon={<FileText size={14} />}>
        <PlacaManager placas={db.placas} onAdd={onAddPlaca} onRemove={onRemovePlaca} onTipo={onPlacaTipo} catalogo={db.catalogo} />
      </Section>

      <Section title="Preços do contrato (com histórico)" icon={<FileText size={14} />}>
        <PrecosManager versoes={db.versoesPreco} catalogo={db.catalogo} onSave={onSavePrecos} onEditDatas={onEditPrecoDatas} onDelete={onDeletePreco} />
      </Section>

      <Section title="Orçamento por coordenação" icon={<FileText size={14} />}>
        <OrcamentoAdmin onToast={onToast} onErr={onErr} />
      </Section>

      <Section title="Feriados (hora extra)" icon={<Clock size={14} />}>
        <FeriadosManager feriados={db.feriados} onSave={onSaveFeriados} />
      </Section>

      <Section title="E-mail automático (Office 365)" icon={<Mail size={14} />}>
        <EmailConfigPanel settings={db.settings || {}} onSave={onSaveSettings} onToast={onToast} />
      </Section>
    </div>
  );
}

function PlateConflictAudit({ conflicts, onOpen }) {
  if (!conflicts.length) {
    return (
      <div style={{ fontSize: 12.5, color: T.inkSoft }}>
        Nenhum conflito encontrado: nenhuma placa aparece em coordenações diferentes com horários sobrepostos.
      </div>
    );
  }
  const fmtRange = (e) => `${fmtDateTimeShort(e.inicio.toISOString())} ate ${fmtDateTimeShort(e.fim.toISOString())}`;
  return (
    <div>
      <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600, marginBottom: 10 }}>
        Mesma placa registrada em coordenações diferentes com horários que se sobrepõem — um mesmo veículo não pode estar em dois lugares ao mesmo tempo. Verifique os relatórios abaixo.
      </div>
      {conflicts.map((c, i) => (
        <div key={i} style={{ border: `1.5px solid ${T.danger}`, borderRadius: 10, padding: 12, marginBottom: 10 }}>
          <div style={{ fontFamily: "Segoe UI, Selawik, Arial, sans-serif", fontSize: 13, fontWeight: 700, color: T.ink, marginBottom: 8 }}>Placa {c.placa}</div>
          {[c.a, c.b].map((e, j) => (
            <div key={j} style={{ fontSize: 12, color: T.inkSoft, marginBottom: j === 0 ? 4 : 0 }}>
              <b style={{ color: T.ink }}>Relatório Nº {e.numero}</b> · {e.empresa} · {e.coordenacao} · {fmtRange(e)}
              {onOpen && <button onClick={() => onOpen(e.reportId)} style={{ marginLeft: 8, background: T.orange, color: "#fff", border: "none", borderRadius: 6, padding: "3px 9px", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}>Abrir / corrigir</button>}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

const TABS = [["rd", "Relatório Diário de Hidrojato", "Cadastro e assinatura"], ["go", "Gestão Operacional", "Avaliação e medição (Cenibra)"]];
function TabBar({ tab, setTab }) {
  return (
    <div className="flex gap-2" style={{ marginBottom: 16 }}>
      {TABS.map(([k, l, sub]) => {
        const on = tab === k;
        return (
          <button key={k} onClick={() => setTab(k)} style={{
            flex: 1, textAlign: "left", cursor: "pointer", borderRadius: 12, padding: "10px 12px",
            border: `1.5px solid ${on ? T.orange : T.line}`, background: on ? T.orange : "#fff", color: on ? "#fff" : T.ink,
          }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, lineHeight: 1.15 }}>{l}</div>
            <div style={{ fontSize: 11, opacity: on ? 0.85 : 0.6, marginTop: 2 }}>{sub}</div>
          </button>
        );
      })}
    </div>
  );
}

function GestaoView({ session, reports, catalogo, onOpen, onRefresh, onErr, onToast }) {
  const [sub, setSub] = useState("rel");
  const [coord, setCoord] = useState("");
  const [status, setStatus] = useState("todos");
  const lista = session.role === "admin" ? COORDENACOES : (session.coordenacoes || []);
  const vis = reports.filter((r) => (!coord || r.coordenacao === coord) && lista.includes(r.coordenacao) &&
    (status === "todos" || (status === "concluidos" ? r.stageIndex >= STAGES.length : r.stageIndex < STAGES.length)));
  const pend = reports.filter((r) => lista.includes(r.coordenacao) && r.stageIndex < STAGES.length).length;
  return (
    <div>
      <div style={{ fontSize: 21, fontWeight: 600 }}>Gestão Operacional</div>
      <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 12 }}>Avalie os relatórios das suas coordenações e confira a medição do período.</div>
      <div className="flex gap-2" style={{ marginBottom: 12, borderBottom: `2px solid ${T.line}` }}>
        {[["rel", "Relatórios"], ["orc", "Orçamento"], ["med", "Medição / Excel / PDF"]].map(([k, l]) => (
          <button key={k} onClick={() => setSub(k)} style={{ padding: "8px 10px", background: "none", border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
            color: sub === k ? T.orange : T.inkSoft, borderBottom: `3px solid ${sub === k ? T.orange : "transparent"}`, marginBottom: -2 }}>{l}</button>
        ))}
      </div>
      {sub === "orc" ? <OrcamentoView onErr={onErr} /> : sub === "med" ? <MedicaoView session={session} onErr={onErr} onToast={onToast} /> : (
        <div>
          <div className="flex gap-2 items-center" style={{ marginBottom: 10 }}>
            <select value={coord} onChange={(e) => setCoord(e.target.value)} style={{ ...inputStyle, flex: 1 }}>
              <option value="">Todas as minhas coordenações</option>
              {lista.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
            <select value={status} onChange={(e) => setStatus(e.target.value)} style={{ ...inputStyle, flex: 1 }}>
              <option value="todos">Todos</option><option value="concluidos">Concluídos (3 assinaturas)</option><option value="andamento">Em assinatura</option>
            </select>
            <Btn variant="ghost" onClick={onRefresh}><RefreshCw size={15} /></Btn>
          </div>
          <PendenciasPanel reports={reports.filter((r) => lista.includes(r.coordenacao))} session={session} onOpen={onOpen} />
          {vis.length === 0 && <div style={{ color: T.inkSoft, fontSize: 13, padding: 20, textAlign: "center" }}>Nenhum relatório para este filtro.</div>}
          <div className="flex flex-col gap-2.5">
            {vis.map((r) => (
              <button key={r.id} onClick={() => onOpen(r.id)} style={{ textAlign: "left", background: T.card, border: `1px solid ${T.line}`, borderRadius: 12, padding: "12px 14px", cursor: "pointer" }}>
                <div className="flex items-center justify-between">
                  <span style={{ fontWeight: 600, fontSize: 12.5, color: T.orangeDeep }}>Nº {r.numero} · {r.coordenacao}{r.emergencial ? " · EMERGENCIAL" : ""}</span>
                  <StatusChip stageIndex={r.stageIndex} report={r} />
                </div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{r.placaTag} <span style={{ fontWeight: 500, fontSize: 12, color: T.inkSoft }}>· {r.empresa}</span></div>
                <div style={{ fontSize: 12, color: T.inkSoft }}>
                  {((catalogo.modalidades || []).find((q) => q.key === r.modalidade) || {}).nome || "—"} · {r.data ? new Date(r.data + "T00:00").toLocaleDateString("pt-BR") : "—"}
                </div>
              </button>
            ))}
          </div>

function OrcamentoView({ onErr }) {
  const [ano, setAno] = useState(new Date().getFullYear());
  const [d, setD] = useState(null);
  useEffect(() => { api(`/orcamento?ano=${ano}`).then(setD).catch(onErr); }, [ano]);
  const Barra = ({ m }) => {
    const base = Math.max(m.orcamento, m.realizado + m.emAssinatura, 1);
    const estourou = m.orcamento > 0 && m.saldo < 0;
    return (
      <div style={{ marginBottom: 10 }}>
        <div style={{ position: "relative", height: 18, background: "#E9EEF0", borderRadius: 9, overflow: "hidden" }}>
          <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${m.realizado / base * 100}%`, background: estourou ? T.danger : T.orange }} />
          <div style={{ position: "absolute", top: 0, bottom: 0, left: `${m.realizado / base * 100}%`, width: `${m.emAssinatura / base * 100}%`, background: "repeating-linear-gradient(45deg,#E0A23A,#E0A23A 4px,#F3D08A 4px,#F3D08A 8px)" }} />
          {m.orcamento > 0 && <div style={{ position: "absolute", top: 0, bottom: 0, left: `${m.orcamento / base * 100}%`, width: 2, background: T.ink }} title="Meta" />}
        </div>
        <div className="flex justify-between" style={{ fontSize: 11.5, marginTop: 3 }}>
          <span>Realizado <b>{brl(m.realizado)}</b>{m.emAssinatura > 0 ? <span style={{ color: T.amber }}> (+{brl(m.emAssinatura)} em assinatura)</span> : null}</span>
          <span>Meta <b>{brl(m.orcamento)}</b></span>
        </div>
        <div style={{ fontSize: 12.5, fontWeight: 700, color: m.orcamento === 0 ? T.inkSoft : estourou ? T.danger : T.green }}>
          {m.orcamento === 0 ? "Orçamento não cadastrado" : estourou ? `Estourou ${brl(-m.saldo)} (${m.pct}% da meta)` : `Sobra ${brl(m.saldo)} (${m.pct}% consumido)`}
        </div>
      </div>
    );
  };
  return (
    <div>
      <div className="flex items-center gap-2" style={{ marginBottom: 10 }}>
        <div style={{ fontWeight: 600, fontSize: 15 }}>Orçamento x realizado em</div>
        <select value={ano} onChange={(e) => setAno(+e.target.value)} style={{ ...inputStyle, width: 100 }}>
          {[0, 1, -1, 2].map((o) => { const y = new Date().getFullYear() + o; return <option key={y} value={y}>{y}</option>; })}
        </select>
      </div>
      <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 12 }}>Realizado = relatórios concluídos (3 assinaturas), pelos preços da data do serviço. A faixa listrada é o que ainda está em assinatura. A linha preta é a meta.</div>
      {!d ? <div style={{ color: T.inkSoft }}>Carregando…</div> : d.coordenacoes.map((c) => (
        <div key={c.coord} style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 12 }}>
          <div className="flex justify-between" style={{ marginBottom: 8 }}>
            <b style={{ fontSize: 15 }}>{c.coord}</b>
            <span style={{ fontSize: 12.5, fontWeight: 700, color: c.total.orcamento === 0 ? T.inkSoft : c.total.saldo < 0 ? T.danger : T.green }}>
              {c.total.orcamento === 0 ? "sem orçamento" : c.total.saldo < 0 ? `Estourou ${brl(-c.total.saldo)}` : `Sobra ${brl(c.total.saldo)}`}
            </span>
          </div>
          {d.modalidades.map((q) => (<div key={q.key}><div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, marginBottom: 4 }}>{q.nome}</div><Barra m={c.modalidades[q.key]} /></div>))}
          <div style={{ fontSize: 12, borderTop: `1px solid ${T.line}`, paddingTop: 6 }}>
            Total: realizado <b>{brl(c.total.realizado)}</b> de <b>{brl(c.total.orcamento)}</b>{c.total.emAssinatura > 0 ? <> · previsto com pendentes: saldo <b>{brl(c.total.saldoPrevisto)}</b></> : null}
          </div>
        </div>
      ))}
    </div>
  );
}

function baixar(path, nome, onErr) {
  return fetch("/api" + path, { credentials: "same-origin" }).then(async (res) => {
    if (!res.ok) { let d = null; try { d = await res.json(); } catch (e) {} const er = new Error((d && d.detail) || ("Erro " + res.status)); er.status = res.status; throw er; }
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }).catch(onErr);
}
const brl = (v) => (v == null ? "—" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }));
