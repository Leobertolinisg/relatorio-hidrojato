function PrecosManager({ versoes, catalogo, onSave, onEditDatas, onDelete }) {
  const ordenadas = [...(versoes || [])].sort((a, b) => a.vigencia.localeCompare(b.vigencia));
  const atual = ordenadas.length ? ordenadas[ordenadas.length - 1] : { itens: {} };
  const eqs = catalogo.equipamentos;
  const [eq, setEq] = useState(eqs.length ? eqs[0].key : "");
  const [itens, setItens] = useState(() => JSON.parse(JSON.stringify(atual.itens || {})));
  const [vig, setVig] = useState(new Date().toISOString().slice(0, 10));
  const [fim, setFim] = useState("");
  const [rot, setRot] = useState("");
  const [busy, setBusy] = useState(false);
  const [ed, setEd] = useState(null);   // { id, vigencia, vigenciaFim, rotulo }
  const setVal = (e, c, v) => setItens({ ...itens, [e]: { ...(itens[e] || {}), [c]: v } });
  const cods = eq === "revesa" ? [{ key: "mob", nome: "Mobilização por pessoa" }, { key: "desmob", nome: "Desmobilização por pessoa" }] : catalogo.codigos;
  const salvar = async () => {
    setBusy(true);
    const ok = await onSave({ vigencia: vig, vigenciaFim: fim, rotulo: rot || ("Tabela de " + vig), itens });
    setBusy(false); if (ok) { setRot(""); setFim(""); }
  };
  const br = (d) => (d ? new Date(d + "T00:00").toLocaleDateString("pt-BR") : "");
  return (
    <div>
      <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>
        Cada tabela vale de uma <b>data inicial</b> até uma <b>data final</b> (opcional; sem data final vale até entrar uma tabela mais nova). O relatório usa a tabela vigente na <b>data do serviço</b>. Para reajustar, cadastre uma nova tabela com a data de início: as antigas continuam valendo para o período delas.
      </div>
      <div style={{ background: "#F7F9FA", borderRadius: 10, padding: 12, marginBottom: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 12.5, marginBottom: 8 }}>Nova tabela de preços</div>
        <Field label="Equipamento">
          <select value={eq} onChange={(e) => setEq(e.target.value)} style={inputStyle}>
            {eqs.map((q) => <option key={q.key} value={q.key}>{q.nome}</option>)}
            <option value="revesa">Revesa (mobilização por pessoa)</option>
          </select>
        </Field>
        {cods.map((c) => (
          <div key={c.key} className="flex items-center justify-between gap-2" style={{ marginBottom: 6 }}>
            <span style={{ fontSize: 12.5, flex: 1 }}>{c.nome}</span>
            <input type="number" step="0.01" value={(itens[eq] || {})[c.key] ?? ""} onChange={(e) => setVal(eq, c.key, e.target.value)} style={{ ...inputStyle, width: 120, padding: "5px 8px" }} />
          </div>
        ))}
        <div className="flex gap-2 flex-wrap" style={{ marginBottom: 4 }}>
          <Btn variant="ghost" onClick={() => setItens({})}>Limpar todos os valores (cadastrar do zero)</Btn>
          <Btn variant="ghost" onClick={() => setItens(JSON.parse(JSON.stringify(atual.itens || {})))}>Copiar da tabela mais recente</Btn>
        </div>
        <div className="flex gap-2" style={{ marginTop: 8 }}>
          <div style={{ flex: 1 }}><Field label="Início da vigência"><TextInput type="date" value={vig} onChange={(e) => setVig(e.target.value)} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Fim (opcional)"><TextInput type="date" value={fim} onChange={(e) => setFim(e.target.value)} /></Field></div>
        </div>
        <Field label="Descrição"><TextInput value={rot} onChange={(e) => setRot(e.target.value)} placeholder="Ex.: Reajuste 2027" /></Field>
        <Btn onClick={salvar} disabled={busy || !vig}>Salvar nova tabela de preços</Btn>
      </div>
      <div style={{ fontWeight: 700, fontSize: 12.5, marginBottom: 6 }}>Tabelas cadastradas ({ordenadas.length})</div>
      {ordenadas.length === 0 && <div style={{ fontSize: 12.5, color: T.danger }}>Nenhuma tabela cadastrada: a medição fica sem preço até você cadastrar uma.</div>}
      {ordenadas.slice().reverse().map((v) => (
        <div key={v.id} style={{ fontSize: 12.5, padding: "8px 0", borderBottom: `1px solid ${T.line}` }}>
          {ed && ed.id === v.id ? (
            <div>
              <div className="flex gap-2">
                <div style={{ flex: 1 }}><Field label="Início"><TextInput type="date" value={ed.vigencia} onChange={(e) => setEd({ ...ed, vigencia: e.target.value })} /></Field></div>
                <div style={{ flex: 1 }}><Field label="Fim (vazio = em aberto)"><TextInput type="date" value={ed.vigenciaFim} onChange={(e) => setEd({ ...ed, vigenciaFim: e.target.value })} /></Field></div>
              </div>
              <Field label="Descrição"><TextInput value={ed.rotulo} onChange={(e) => setEd({ ...ed, rotulo: e.target.value })} /></Field>
              <div className="flex gap-2">
                <Btn onClick={async () => { await onEditDatas(v.id, { vigencia: ed.vigencia, vigenciaFim: ed.vigenciaFim, rotulo: ed.rotulo }); setEd(null); }}>Salvar datas</Btn>
                <Btn variant="ghost" onClick={() => setEd(null)}>Cancelar</Btn>
              </div>
            </div>
          ) : (
            <div>
              <b>{v.rotulo}</b>
              <div style={{ color: T.inkSoft }}>De {br(v.vigencia)} {v.vigenciaFim ? `até ${br(v.vigenciaFim)}` : "— em aberto"}{v.criadoPor ? ` · por ${v.criadoPor}` : ""}</div>
              <div className="flex gap-3" style={{ marginTop: 3 }}>
                <button onClick={() => setEd({ id: v.id, vigencia: v.vigencia, vigenciaFim: v.vigenciaFim || "", rotulo: v.rotulo })} style={{ background: "none", border: "none", color: T.orange, fontWeight: 700, cursor: "pointer", padding: 0, fontSize: 12.5 }}>Editar datas</button>
                <button onClick={() => { if (window.confirm(`Apagar a tabela "${v.rotulo}"?`)) onDelete(v.id); }} style={{ background: "none", border: "none", color: T.danger, fontWeight: 700, cursor: "pointer", padding: 0, fontSize: 12.5 }}>Apagar tabela</button>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

  );
}

function PeopleManager({ people, onAdd, onEdit, onRemove, onReset }) {
  const [editId, setEditId] = useState(null);
  const [nome, setNome] = useState("");
  const [matricula, setMatricula] = useState("");
  const [role, setRole] = useState("supervisor_empresa");
  const [empresa, setEmpresa] = useState(EMPRESAS[0]);
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [coords, setCoords] = useState([]);

  const toggleCoord = (c) => setCoords(coords.includes(c) ? coords.filter((x) => x !== c) : [...coords, c]);
  const needsCoord = COORD_ROLES.includes(role);
  const needsEmpresa = EMPRESA_ROLES.includes(role);

  const limpar = () => { setEditId(null); setNome(""); setMatricula(""); setEmail(""); setSenha(""); setCoords([]); setRole("supervisor_empresa"); };
  const iniciarEdicao = (p) => {
    setEditId(p.id); setNome(p.nome); setMatricula(p.matricula); setRole(p.role); setEmail(p.email || "");
    setEmpresa(p.empresa || EMPRESAS[0]); setCoords(p.coordenacoes || []); setSenha("");
    setTimeout(() => { const el = document.getElementById("form-pessoa"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 50);
  };
  const dadosForm = () => ({ nome: nome.trim(), matricula: matricula.trim(), role, email: email.trim(), coordenacoes: needsCoord ? coords : [], empresa: needsEmpresa ? empresa : "" });
  const add = () => {
    if (editId) { if (!nome.trim() || !matricula.trim()) return; onEdit(editId, dadosForm()); limpar(); return; }
    if (!nome.trim() || !matricula.trim() || senha.length < 4) return;
    onAdd({ ...dadosForm(), senha });
    limpar();
  };

  return (
    <div>
      {people.map((p) => (
        <div key={p.id} style={{ padding: "8px 0", borderBottom: `1px solid ${T.line}` }}>
          <div className="flex items-center justify-between">
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{p.nome}</div>
              <div style={{ fontSize: 11.5, color: T.inkSoft }}>
                {ROLE_LABEL[p.role]} · mat. {p.matricula}
                {p.empresa ? " · " + p.empresa : ""}
                {p.coordenacoes && p.coordenacoes.length ? " · " + p.coordenacoes.join(", ") : ""}
              </div>
              <div style={{ fontSize: 11, color: T.inkSoft }}>{p.email}</div>
              <div className="flex gap-3 items-center">
                <button onClick={() => iniciarEdicao(p)} style={{ background: "none", border: "none", color: T.orange, fontWeight: 700, fontSize: 12.5, cursor: "pointer", padding: 0 }}>Editar cadastro</button>
                <ResetPw onReset={(pw) => onReset(p.id, pw)} />
              </div>
            </div>
            <button onClick={() => onRemove(p.id)} style={{ background: "none", border: "none", color: T.danger, cursor: "pointer" }}><Trash2 size={14} /></button>
          </div>
        </div>
      ))}
      <div id="form-pessoa" style={{ marginTop: 14, background: editId ? "#E8F3EC" : "#F7F9FA", borderRadius: 10, padding: 12, border: editId ? `1.5px solid ${T.orange}` : "none" }}>
        <div style={{ fontWeight: 700, fontSize: 12.5, marginBottom: 8 }}>{editId ? "Editar cadastro" : "Adicionar pessoa"}</div>
        <Field label="Perfil">
          <select value={role} onChange={(e) => setRole(e.target.value)} style={inputStyle}>
            {ROLES.map((r) => <option key={r.value} value={r.value}>{r.label}</option>)}
          </select>
        </Field>
        <Field label="Nome"><TextInput value={nome} onChange={(e) => setNome(e.target.value)} /></Field>
        <Field label="Matrícula"><TextInput value={matricula} onChange={(e) => setMatricula(e.target.value)} /></Field>
        <Field label="E-mail"><TextInput value={email} onChange={(e) => setEmail(e.target.value)} placeholder="nome@empresa.com" /></Field>
        {!editId && <Field label="Senha inicial" hint="Mínimo 4 caracteres. Repasse à pessoa por canal seguro."><TextInput type="password" value={senha} onChange={(e) => setSenha(e.target.value)} autoComplete="new-password" /></Field>}
        {editId && <div style={{ fontSize: 11.5, color: T.inkSoft, marginBottom: 8 }}>Para trocar a senha use "Redefinir senha" na lista.</div>}
        {needsEmpresa && (
          <Field label="Empresa de Hidrojato">
            <select value={empresa} onChange={(e) => setEmpresa(e.target.value)} style={inputStyle}>
              {EMPRESAS.map((e) => <option key={e} value={e}>{e}</option>)}
            </select>
          </Field>
        )}
        {needsCoord && (
          <Field label="Coordenações">
            <div className="flex flex-wrap gap-2">
              {COORDENACOES.map((c) => (
                <button key={c} type="button" onClick={() => toggleCoord(c)} style={{
                  padding: "5px 10px", borderRadius: 16, fontSize: 12, fontWeight: 600,
                  border: `1.5px solid ${coords.includes(c) ? T.teal : T.line}`,
                  background: coords.includes(c) ? T.teal : "#fff", color: coords.includes(c) ? "#fff" : T.ink, cursor: "pointer",
                }}>{c}</button>
              ))}
            </div>
          </Field>
        )}
        <div className="flex gap-2">
          <Btn onClick={add} disabled={!nome.trim() || !matricula.trim() || (!editId && senha.length < 4)}>{editId ? <><Check size={14} /> Salvar alterações</> : <><Plus size={14} /> Adicionar</>}</Btn>
          {editId && <Btn variant="ghost" onClick={limpar}>Cancelar</Btn>}
        </div>
      </div>
    </div>
  );
}

function ResetPw({ onReset }) {
  const [open, setOpen] = useState(false);
  const [pw, setPw] = useState("");
  if (!open) return <button onClick={() => setOpen(true)} style={{ background: "none", border: "none", color: T.teal, fontSize: 11.5, cursor: "pointer", padding: 0, marginTop: 2 }}>Redefinir senha</button>;
  return (
    <div className="flex gap-2" style={{ marginTop: 4 }}>
      <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="nova senha" style={{ ...inputStyle, padding: "5px 8px", fontSize: 12 }} />
      <Btn variant="ghost" disabled={pw.length < 4} onClick={() => { onReset(pw); setPw(""); setOpen(false); }}>OK</Btn>
    </div>
  );
}

function EmailConfigPanel({ settings, onSave, onToast }) {
  const [destinoEmail, setDestinoEmail] = useState(settings.destinoEmail || "");
  const [testMsg, setTestMsg] = useState("");

  const testSend = async () => {
    setTestMsg("Enviando…");
    try {
      await api("/settings", "PUT", { destinoEmail });
      const r = await api("/settings/test-email", "POST", {});
      if (r.status === "enviado") setTestMsg(`E-mail de teste enviado para ${r.destino}.`);
      else if (r.status === "simulado") setTestMsg("Envio de e-mail ainda não configurado no servidor (veja o README: Microsoft Graph ou SMTP).");
      else setTestMsg(`Erro ao enviar: ${r.error}`);
    } catch (e) { setTestMsg(e.message); }
  };

  return (
    <div>
      <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>
        Ao concluir as 3 assinaturas, o servidor envia um e-mail com o PDF em anexo para os 3 responsáveis e para o e-mail de destino abaixo.
        Status do envio: <b style={{ color: settings.smtpConfigured ? T.teal : T.danger }}>{settings.smtpConfigured ? `${settings.emailModo === "graph" ? "Microsoft Graph" : "SMTP"} configurado (${settings.smtpFrom || "remetente"})` : "envio NÃO configurado — e-mails apenas simulados"}</b>.
      </div>
      <Field label="E-mail de destino (recebe cópia de todo relatório concluído)"><TextInput value={destinoEmail} onChange={(e) => setDestinoEmail(e.target.value)} placeholder="nome@cenibra.com.br" /></Field>
      <div className="flex gap-2">
        <Btn onClick={() => onSave({ destinoEmail })}>Salvar</Btn>
        <Btn variant="ghost" onClick={testSend}><Mail size={14} /> Enviar e-mail de teste</Btn>
      </div>
      {testMsg && <div style={{ marginTop: 8, fontSize: 12.5, color: T.inkSoft }}>{testMsg}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
