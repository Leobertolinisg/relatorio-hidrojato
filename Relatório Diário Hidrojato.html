    const d = new Date(v);
    if (isNaN(d.getTime())) return v;
    return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch { return v; }
}

/* Horas por registro — usa datas completas, então vira o dia automaticamente.
   Não é mostrado no relatório/tela, mas fica calculado para exportar. */
function registroHoras(r) {
  if (!r.inicio || !r.fim) return 0;
  const a = new Date(r.inicio), b = new Date(r.fim);
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return 0;
  const diffMs = b - a;
  if (diffMs <= 0) return null; // inválido — fim antes/igual ao início
  return diffMs / 3600000;
}
function totalHoras(registros) {
  return registros.reduce((sum, r) => {
    const h = registroHoras(r);
    return sum + (h || 0);
  }, 0);
}
function areaLabel(r) {
  return r.area === "Outra (especificar)" ? (r.areaOutra || "Outra") : (r.area || "—");
}

----------------------------------------------------------------*/
function pdfBand(doc, x, y, w, text) {
  doc.setFillColor(237, 240, 242);
  doc.rect(x, y, w, 6, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(9.5);
  doc.setTextColor(28, 35, 43);
  doc.text(text.toUpperCase(), x + 2, y + 4.2);
  return y + 6 + 3;
}
function pdfKV(doc, x, y, w, label, value) {
  doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(100, 110, 122);
  doc.text(label.toUpperCase(), x, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(28, 35, 43);
  const lines = doc.splitTextToSize(String(value == null || value === "" ? "—" : value), w);
  doc.text(lines, x, y + 4.4);
  return y + 4.4 + lines.length * 4.3;
}
function pdfFileName(report) {
  const empresaSlug = (report.empresa || "Hidrojato").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "");
  return `Relatorio-${empresaSlug}-${report.numero}.pdf`;
}
function loadImageSize(dataUrl) {
  return new Promise((resolve) => {
    if (!dataUrl) { resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

  return doc;
}

}

/* ---------------------------------------------------------------
   Auditoria — placas repetidas em coordenações diferentes
   com intervalos de horário sobrepostos (impossível fisicamente)
----------------------------------------------------------------*/
function findPlateConflicts(reports) {
  const entries = [];
  reports.forEach((r) => {
    (r.registros || []).forEach((reg) => {
      if (!reg.inicio || !reg.fim || !r.placaTag) return;
      const a = new Date(reg.inicio), b = new Date(reg.fim);
      if (isNaN(a) || isNaN(b) || b <= a) return;
      entries.push({
        reportId: r.id, numero: r.numero, placa: r.placaTag, coordenacao: r.coordenacao,
        empresa: r.empresa, inicio: a, fim: b, servicos: reg.servicos,
      });
    });
  });
  const conflicts = [];
  for (let i = 0; i < entries.length; i++) {
    for (let j = i + 1; j < entries.length; j++) {
      const e1 = entries[i], e2 = entries[j];
      if (e1.reportId === e2.reportId) continue;
      if (!e1.placa || e1.placa !== e2.placa) continue;
      if (e1.coordenacao === e2.coordenacao) continue;
      const overlap = e1.inicio < e2.fim && e2.inicio < e1.fim;
      if (overlap) conflicts.push({ placa: e1.placa, a: e1, b: e2 });
    }
  }
  return conflicts;
}

function exportCSV(reports) {
  const headers = ["Numero","Empresa","Coordenacao","Cliente","Placa","Data","Equipamentos","Saida",
    "RegistroInicio","RegistroFim","HorasRegistro","Servicos","Area","EquipeCampo",
    "SupervisorEmpresa","MatriculaSupervisorEmpresa","OperadorCenibra","MatriculaOperadorCenibra",
    "SupervisorOperacionalCenibra","MatriculaSupervisorCenibra","Status","EmailStatus"];
  const rows = [];
  reports.forEach((r) => {
    const statusLabel = r.stageIndex >= STAGES.length ? "Concluido" : `Aguardando ${stageLabel(STAGES[r.stageIndex], r)}`;
    const resp = r.responsaveis || {};
    const equipeCampoStr = (r.equipeCampo || []).map((m) => `${m.nome} (${m.matricula})`).join(" | ");
    (r.registros || []).forEach((reg) => {
      const h = registroHoras(reg);
      rows.push([
        r.numero, r.empresa, r.coordenacao, "Cenibra", r.placaTag, r.data,
        (r.equipamentos || []).join(" | "), r.saida,
        reg.inicio, reg.fim, h == null ? "0" : h.toFixed(2),
        (reg.servicos || "").replace(/\n/g, " "), areaLabel(reg), equipeCampoStr,
        (resp.supervisor_empresa && resp.supervisor_empresa.nome) || "", (resp.supervisor_empresa && resp.supervisor_empresa.matricula) || "",
        (resp.cenibra_operador && resp.cenibra_operador.nome) || "", (resp.cenibra_operador && resp.cenibra_operador.matricula) || "",
        (resp.cenibra_supervisor && resp.cenibra_supervisor.nome) || "", (resp.cenibra_supervisor && resp.cenibra_supervisor.matricula) || "",
        statusLabel, r.emailStatus || "",
      ]);
    });
  });
  const csv = [headers, ...rows].map((row) => row.map((v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`).join(";")).join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `relatorios-servitec-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------------
   Signature Pad
----------------------------------------------------------------*/
function SignaturePad({ onChange, height = 140 }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const empty = useRef(true);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  };

  const start = (e) => {
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    drawing.current = true;
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    ctx.lineTo(x, y);
    ctx.strokeStyle = T.ink;
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.stroke();
    empty.current = false;
  };
  const end = () => {
    if (!drawing.current) return;
    drawing.current = false;
    if (!empty.current) onChange(canvasRef.current.toDataURL("image/png"));
  };
  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    empty.current = true;
    onChange(null);
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={480}
        height={height}
        style={{ width: "100%", height, background: "#fff", border: `1.5px dashed ${T.line}`, borderRadius: 8, touchAction: "none", cursor: "crosshair" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <div className="flex justify-between items-center mt-1.5">
        <span style={{ fontSize: 11, color: T.inkSoft, fontFamily: "Inter" }}>Assine com o dedo ou mouse</span>
        <button onClick={clear} style={{ fontSize: 12, color: T.orangeDeep, fontFamily: "Inter", fontWeight: 600, background: "none", border: "none", cursor: "pointer" }}>Limpar</button>
      </div>
    </div>
  );
}

    danger: { background: "transparent", color: T.danger, border: `1.5px solid #EBC9C7` },

  return (
    <button type={type} disabled={disabled} onClick={onClick} style={{ ...base, ...variants[variant], ...style }}>
      {children}
    </button>
  );
}

function StatusChip({ stageIndex, report }) {
  const done = stageIndex >= STAGES.length;
  const label = done ? "Concluído" : `Aguardando ${stageLabel(STAGES[stageIndex], report)}`;
  const bg = done ? T.greenSoft : T.amberSoft;
  const color = done ? T.green : T.amber;
  return (
    <span style={{ fontFamily: "Inter", fontSize: 11.5, fontWeight: 700, background: bg, color, padding: "3px 10px", borderRadius: 20, whiteSpace: "nowrap" }}>
      {label}
    </span>
  );
}

/* ---------------------------------------------------------------
   Photo capture
----------------------------------------------------------------*/
function resizeImage(dataUrl, maxW = 900) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.src = dataUrl;
  });
}

function PhotoCapture({ value, onChange }) {
  const inputRef = useRef(null);
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const resized = await resizeImage(reader.result);
      onChange(resized);
    };
    reader.readAsDataURL(file);
  };
  return (
    <div>
      {value ? (
        <div className="relative" style={{ borderRadius: 10, overflow: "hidden", border: `1.5px solid ${T.line}` }}>
          <img src={value} alt="Placa" style={{ width: "100%", display: "block", maxHeight: 260, objectFit: "cover" }} />
          <button onClick={() => onChange(null)} style={{ position: "absolute", top: 8, right: 8, background: "rgba(28,35,43,0.85)", color: "#fff", border: "none", borderRadius: 6, padding: "5px 9px", fontFamily: "Inter", fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
            <X size={13} /> Remover
          </button>
        </div>
      ) : (
        <button onClick={() => inputRef.current.click()} style={{
          width: "100%", padding: "28px 12px", borderRadius: 10, border: `2px dashed ${T.line}`,
          background: "#F7F9FA", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, cursor: "pointer",
        }}>
          <Camera size={26} color={T.orange} />
          <span style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13.5, color: T.ink }}>Fotografar a placa do caminhão</span>
          <span style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft }}>Toque para abrir a câmera</span>
        </button>
      )}
      <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{ display: "none" }} />
    </div>
  );
}

/* =================================================================
   MAIN APP
==================================================================*/
function App() {
  const [db, setDb] = useState(null);
  const [session, setSession] = useState(null);
  const [view, setView] = useState("list");
  const [selectedId, setSelectedId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [step, setStep] = useState(0);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 4200); };

  useEffect(() => { setDb(loadDB()); }, []);

  if (!db) {
    return (
      <div style={{ textAlign: "center", padding: 60, color: T.inkSoft, fontFamily: "Inter" }}>
        <RefreshCw size={20} className="animate-spin" style={{ marginBottom: 8 }} />
        <div>Carregando relatórios…</div>
      </div>
    );
  }

  const reports = Object.values(db.reports).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const persist = (nextDb) => { setDb(nextDb); saveDB(nextDb); };

  const handleLogin = (s) => { setSession(s); setView("list"); showToast(`Bem-vindo, ${s.nome}.`); };
  const handleLogout = () => { setSession(null); showToast("Sessão encerrada."); setView("list"); };

  const startNew = () => {
    if (!session || (session.role !== "campo_operador" && session.role !== "admin")) {
      showToast("Faça login como Operador de Campo para criar um novo relatório.");
      setView("login");
      return;
    }
    const next = db.counter + 1;
    persist({ ...db, counter: next });
    setDraft(blankReport(String(next).padStart(6, "0")));
    setStep(0);
    setView("new");
  };

  const saveDraftAsSubmitted = () => {
    setSaving(true);
    const report = { ...draft, stageIndex: 0 };
    const nextReports = { ...db.reports, [report.id]: report };
    persist({ ...db, reports: nextReports });
    setSaving(false);
    setDraft(null);
    setView("list");
    showToast("Relatório enviado para aprovação.");
  };

  const openDetail = (id) => { setSelectedId(id); setView("detail"); };

  const signStage = async (report, stageKey, signatureImg) => {
    const stageIdx = STAGES.findIndex((s) => s.key === stageKey);
    const assigned = report.responsaveis[stageKey] || {};
    let updated = {
      ...report,
      stageIndex: stageIdx + 1,
      assinaturas: {
        ...report.assinaturas,
        [stageKey]: { nome: assigned.nome, matricula: assigned.matricula, dataHora: new Date().toISOString(), assinatura: signatureImg },
      },
    };
    if (stageIdx + 1 >= STAGES.length) {
      const result = await sendApprovalEmail(updated, db.emailConfig);
      sendToWebhook(updated, db.emailConfig).then((w) => { if (w && !w.skipped) console.log("Webhook", w); });
      updated = {
        ...updated,
        emailStatus: result.ok ? "enviado" : (result.simulated ? "simulado" : "erro"),
        emailRecipients: result.recipients || [],
        emailError: result.error || null,
      };
    }
    const nextReports = { ...db.reports, [updated.id]: updated };
    persist({ ...db, reports: nextReports });

    if (stageIdx + 1 >= STAGES.length) {
      try {
        const doc = await buildReportPDF(updated);
        doc.save(pdfFileName(updated));
      } catch (e) { console.error("Falha ao gerar PDF", e); }
      if (updated.emailStatus === "enviado") showToast(`Concluído! PDF gerado e e-mail enviado para: ${updated.emailRecipients.join(", ")}`);
      else if (updated.emailStatus === "simulado") showToast(`Concluído! PDF baixado (seria o anexo do e-mail). E-mail ainda é simulado — configure em Administração. Destinatários: ${updated.emailRecipients.join(", ")}`);
      else showToast(`Concluído e PDF baixado, mas o e-mail falhou: ${updated.emailError}`);
    } else {
      showToast(`Assinado. Próxima etapa: ${stageLabel(STAGES[stageIdx + 1], updated)}.`);
    }
  };

  const addPerson = (p) => {
    const person = { id: uid(), ...p };
    persist({ ...db, people: [...db.people, person] });
  };
  const removePerson = (id) => {
    persist({ ...db, people: db.people.filter((p) => p.id !== id) });
  };
  const addPlaca = (pl) => {
    const placa = { id: uid(), ...pl };
    persist({ ...db, placas: [...db.placas, placa] });
  };
  const removePlaca = (id) => {
    persist({ ...db, placas: db.placas.filter((p) => p.id !== id) });
  };
  const saveEmailConfig = (cfg) => {
    persist({ ...db, emailConfig: cfg });
    showToast("Configuração de e-mail salva.");
  };

  const selectedReport = reports.find((r) => r.id === selectedId);

  return (
    <div style={{ fontFamily: "Inter", background: T.paper, minHeight: "100vh", color: T.ink }}>
      <style>{FONTS}</style>
      <Header session={session} onLoginClick={() => setView("login")} onLogout={handleLogout} view={view} setView={setView} />

      <div style={{ maxWidth: 640, margin: "0 auto", padding: "16px 14px 60px" }}>
        {view === "list" ? (
          <ListView reports={reports} onOpen={openDetail} onNew={startNew} session={session} />
        ) : view === "login" ? (
          <LoginView people={db.people} onLogin={handleLogin} onCancel={() => setView("list")} />
        ) : view === "new" && draft ? (
          <NewReportWizard
            draft={draft} setDraft={setDraft} step={step} setStep={setStep} people={db.people} placas={db.placas}
            onCancel={() => { setDraft(null); setView("list"); }}
            onSubmit={saveDraftAsSubmitted} saving={saving}
          />
        ) : view === "detail" && selectedReport ? (
          <DetailView
            report={selectedReport} session={session}
            onBack={() => setView("list")} onSign={signStage} onLoginClick={() => setView("login")}
          />
        ) : view === "admin" ? (
          <AdminView
            db={db} onAddPerson={addPerson} onRemovePerson={removePerson}
            onAddPlaca={addPlaca} onRemovePlaca={removePlaca}
            onSaveEmailConfig={saveEmailConfig} onBack={() => setView("list")}
            onExport={() => exportCSV(reports)}
          />
        ) : (
          <div style={{ textAlign: "center", padding: 40, color: T.inkSoft }}>Nada para mostrar.</div>
        )}
      </div>

      {toast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: T.ink, color: "#fff", padding: "11px 18px", borderRadius: 9,
          fontFamily: "Inter", fontSize: 13.5, fontWeight: 500, boxShadow: "0 8px 24px rgba(0,0,0,.25)",
          maxWidth: "92%", textAlign: "center", zIndex: 50,
        }}>
          {toast}
        </div>
      )}
    </div>
  );
}

  return (

function NewReportWizard({ draft, setDraft, step, setStep, people, placas, onCancel, onSubmit, saving }) {
  const set = (patch) => setDraft({ ...draft, ...patch });

  const toggleEquip = (name) => {
    const has = draft.equipamentos.includes(name);
    set({ equipamentos: has ? draft.equipamentos.filter((e) => e !== name) : [...draft.equipamentos, name] });
  };

  const updateRegistro = (id, patch) => {
    set({ registros: draft.registros.map((r) => (r.id === id ? { ...r, ...patch } : r)) });
  };
  const addRegistro = () => set({ registros: [...draft.registros, { id: uid(), inicio: "", fim: "", servicos: "", area: "", areaOutra: "" }] });
  const removeRegistro = (id) => set({ registros: draft.registros.filter((r) => r.id !== id) });

  const setResponsavel = (key, personId, list) => {
    const p = list.find((pp) => pp.id === personId);
    set({ responsaveis: { ...draft.responsaveis, [key]: p ? { id: p.id, nome: p.nome, matricula: p.matricula, email: p.email } : null } });
  };

  const listCampoOperadores = people.filter((p) => p.role === "campo_operador" && p.empresa === draft.empresa);
  const listSupervisorEmpresa = people.filter((p) => p.role === "supervisor_empresa" && p.empresa === draft.empresa);
  const listOperadorCenibra = people.filter((p) => p.role === "cenibra_operador" && (p.coordenacoes || []).includes(draft.coordenacao));
  const listSupervisorCenibra = people.filter((p) => p.role === "cenibra_supervisor" && (p.coordenacoes || []).includes(draft.coordenacao));

  const canNext = step === 0 ? !!(draft.empresa && draft.coordenacao && draft.placaTag && draft.data)
    : step === 2 ? !!(draft.equipeCampo.length > 0 && draft.responsaveis.supervisor_empresa && draft.responsaveis.cenibra_operador && draft.responsaveis.cenibra_supervisor)
    : step === 3 ? !!draft.fotoPlaca
    : true;

  return (
    <div>
      <div style={{ background: T.card, borderRadius: 14, border: `1px solid ${T.line}`, overflow: "hidden" }}>
        <div style={{ padding: "14px 16px 0" }}>
          <div className="flex items-center justify-between" style={{ marginBottom: 10 }}>
            <span style={{ fontFamily: "Oswald", fontSize: 17, fontWeight: 600 }}>Novo relatório</span>
            <span style={{ fontFamily: "IBM Plex Mono", fontSize: 12, color: T.orangeDeep, fontWeight: 600 }}>Nº {draft.numero}</span>
          </div>
          <div className="flex gap-1" style={{ marginBottom: 14 }}>
            {STEP_LABELS.map((l, i) => (
              <div key={l} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= step ? T.orange : T.line }} />
            ))}
          </div>
        </div>

        <div style={{ padding: "0 16px 18px" }}>
          <div style={{ fontFamily: "Inter", fontSize: 11.5, fontWeight: 700, color: T.inkSoft, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 10 }}>
            {String(step + 1).padStart(2, "0")} · {STEP_LABELS[step]}
          </div>

          {step === 0 && (
            <div>
              <Field label="Empresa de Hidrojato" required hint="Primeira informação a escolher">
                <select value={draft.empresa} onChange={(e) => set({ empresa: e.target.value, placaTag: "" })} style={inputStyle}>
                  <option value="">Selecione…</option>
                  {EMPRESAS.map((e) => <option key={e} value={e}>{e}</option>)}
                </select>
              </Field>
              <Field label="Coordenação (DEFAB)" required>
                <select value={draft.coordenacao} onChange={(e) => set({ coordenacao: e.target.value })} style={inputStyle}>
                  <option value="">Selecione…</option>
                  {COORDENACOES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </Field>
              <Field label="Cliente">
                <div style={{ ...inputStyle, background: "#F2F4F5", color: T.inkSoft, display: "flex", alignItems: "center" }}>Cenibra (fábrica — fixo)</div>
              </Field>
              <Field label="Placa / Tag" required hint={!draft.empresa ? "Escolha a empresa primeiro" : undefined}>
                {(() => {
                  const placasEmpresa = (placas || []).filter((p) => p.empresa === draft.empresa);
                  return (
                    <select value={draft.placaTag} onChange={(e) => set({ placaTag: e.target.value })} style={inputStyle} disabled={!draft.empresa}>
                      <option value="">{draft.empresa ? "Selecione a placa…" : "Escolha a empresa primeiro"}</option>
                      {placasEmpresa.map((p) => <option key={p.id} value={p.placa}>{p.placa}</option>)}
                    </select>
                  );
                })()}
                {(() => {
                  const sel = (placas || []).find((p) => p.empresa === draft.empresa && p.placa === draft.placaTag);
                  return sel && sel.foto ? (
                    <div style={{ marginTop: 8 }}>
                      <img src={sel.foto} alt={sel.placa} style={{ width: "100%", maxHeight: 150, objectFit: "cover", borderRadius: 8, border: `1px solid ${T.line}` }} />
                      <div style={{ fontSize: 11, color: T.inkSoft, marginTop: 3 }}>Foto de referência do veículo cadastrado</div>
                    </div>
                  ) : null;
                })()}
                {draft.empresa && (placas || []).filter((p) => p.empresa === draft.empresa).length === 0 && (
                  <div style={{ fontSize: 11.5, color: T.danger, marginTop: 4 }}>
                    Nenhuma placa cadastrada para {draft.empresa}. Cadastre em Administração → Gerenciar placas.
                  </div>
                )}
              </Field>
              <Field label="Data" required>
                <TextInput type="date" value={draft.data} onChange={(e) => set({ data: e.target.value })} />
              </Field>
              <Field label="Equipamentos">
                <div className="flex flex-wrap gap-2">
                  {EQUIPAMENTOS.map((eq) => {
                    const active = draft.equipamentos.includes(eq);
                    return (
                      <button key={eq} onClick={() => toggleEquip(eq)} type="button" style={{
                        padding: "7px 11px", borderRadius: 20, fontFamily: "Inter", fontSize: 12.5, fontWeight: 600,
                        border: `1.5px solid ${active ? T.orange : T.line}`,
                        background: active ? T.orange : "#fff", color: active ? "#fff" : T.ink, cursor: "pointer",
                      }}>{eq}</button>
                    );
                  })}
                </div>
              </Field>
              <Field label="Saídas">
                <div className="flex gap-2">
                  {["01", "02"].map((s) => (
                    <button key={s} type="button" onClick={() => set({ saida: s })} style={{
                      padding: "7px 14px", borderRadius: 8, fontFamily: "Inter", fontSize: 13, fontWeight: 600,
                      border: `1.5px solid ${draft.saida === s ? T.teal : T.line}`,
                      background: draft.saida === s ? T.teal : "#fff", color: draft.saida === s ? "#fff" : T.ink,
                    }}>{s} Saída</button>
                  ))}
                </div>
              </Field>
            </div>
          )}

          {step === 1 && (
            <div>
              {draft.registros.map((r, idx) => {
                const horas = registroHoras(r);
                const invalid = r.inicio && r.fim && horas == null;
                return (
                  <div key={r.id} style={{ border: `1px solid ${invalid ? T.danger : T.line}`, borderRadius: 10, padding: 12, marginBottom: 10, position: "relative" }}>
                    <div className="flex items-center justify-between" style={{ marginBottom: 8 }}>
                      <span style={{ fontFamily: "IBM Plex Mono", fontSize: 11.5, color: T.inkSoft, fontWeight: 600 }}>REGISTRO {idx + 1}</span>
                      {draft.registros.length > 1 && (
                        <button onClick={() => removeRegistro(r.id)} style={{ color: T.danger, background: "none", border: "none", cursor: "pointer" }}><Trash2 size={15} /></button>
                      )}
                    </div>
                    <div className="flex gap-2" style={{ marginBottom: 4 }}>
                      <div style={{ flex: 1 }}>
                        <Field label="Início (data e hora)"><TextInput type="datetime-local" value={r.inicio} onChange={(e) => updateRegistro(r.id, { inicio: e.target.value })} /></Field>
                      </div>
                      <div style={{ flex: 1 }}>
                        <Field label="Fim (data e hora)"><TextInput type="datetime-local" value={r.fim} onChange={(e) => updateRegistro(r.id, { fim: e.target.value })} /></Field>
                      </div>
                    </div>
                    {invalid && <div style={{ fontSize: 11.5, color: T.danger, marginBottom: 8 }}>Verifique as datas: o fim precisa ser depois do início.</div>}
                    <Field label="Serviços executados">
                      <TextArea rows={2} value={r.servicos} onChange={(e) => updateRegistro(r.id, { servicos: e.target.value })} placeholder="Descreva a atividade realizada" />
                    </Field>
                    <Field label="Área">
                      <select value={r.area} onChange={(e) => updateRegistro(r.id, { area: e.target.value })} style={inputStyle}>
                        <option value="">Selecione…</option>
                        {AREAS.map((a) => <option key={a} value={a}>{a}</option>)}
                      </select>
                    </Field>
                    {r.area === "Outra (especificar)" && (
                      <Field label="Especifique a área">
                        <TextInput value={r.areaOutra} onChange={(e) => updateRegistro(r.id, { areaOutra: e.target.value })} placeholder="Nome da área" />
                      </Field>
                    )}
                  </div>
                );
              })}
              <Btn variant="ghost" onClick={addRegistro}><Plus size={15} /> Adicionar registro</Btn>
            </div>
          )}

          {step === 2 && (
            <div>
              {!draft.empresa && (
                <div style={{ fontSize: 12.5, color: T.danger, marginBottom: 10 }}>Volte ao passo 1 e selecione a empresa de hidrojato antes de escolher a equipe.</div>
              )}
              <EquipeCampoPicker list={listCampoOperadores} selected={draft.equipeCampo} onAdd={(m) => set({ equipeCampo: [...draft.equipeCampo, m] })} onRemove={(id) => set({ equipeCampo: draft.equipeCampo.filter((m) => m.id !== id) })} />
              <ResponsavelPicker label={`Supervisor ${draft.empresa || "da Empresa"}`} list={listSupervisorEmpresa} value={draft.responsaveis.supervisor_empresa && draft.responsaveis.supervisor_empresa.id} onChange={(id) => setResponsavel("supervisor_empresa", id, listSupervisorEmpresa)} />
              <ResponsavelPicker label="Operador Responsável CENIBRA" list={listOperadorCenibra} value={draft.responsaveis.cenibra_operador && draft.responsaveis.cenibra_operador.id} onChange={(id) => setResponsavel("cenibra_operador", id, listOperadorCenibra)} />
              <ResponsavelPicker label="Supervisor Operacional CENIBRA" list={listSupervisorCenibra} value={draft.responsaveis.cenibra_supervisor && draft.responsaveis.cenibra_supervisor.id} onChange={(id) => setResponsavel("cenibra_supervisor", id, listSupervisorCenibra)} />
            </div>
          )}

          {step === 3 && (
            <div>
              <PhotoCapture value={draft.fotoPlaca} onChange={(v) => set({ fotoPlaca: v })} />
              <div style={{ marginTop: 10, fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>
                A foto da placa/tag é obrigatória antes de enviar para aprovação.
              </div>
            </div>
          )}

          {step === 4 && (
            <ReviewSummary draft={draft} />
          )}
        </div>
      </div>

      <div className="flex items-center justify-between" style={{ marginTop: 14 }}>
        <Btn variant="ghost" onClick={step === 0 ? onCancel : () => setStep(step - 1)}>
          <ChevronLeft size={16} /> {step === 0 ? "Cancelar" : "Voltar"}
        </Btn>
        {step < STEP_LABELS.length - 1 ? (
          <Btn onClick={() => canNext && setStep(step + 1)} disabled={!canNext}>Avançar <ChevronRight size={16} /></Btn>
        ) : (
          <Btn onClick={onSubmit} disabled={saving}><Send size={15} /> {saving ? "Enviando…" : "Enviar para aprovação"}</Btn>
        )}
      </div>
    </div>
  );
}

function ReviewSummary({ draft }) {
  const resp = draft.responsaveis || {};
  return (
    <div style={{ fontFamily: "Inter", fontSize: 13.5, color: T.ink }}>
      <SummaryRow label="Empresa de Hidrojato" value={draft.empresa} />
      <SummaryRow label="Coordenação" value={draft.coordenacao} mono />
      <SummaryRow label="Cliente" value="Cenibra" />
      <SummaryRow label="Placa/Tag" value={draft.placaTag} mono />
      <SummaryRow label="Data" value={draft.data ? new Date(draft.data + "T00:00").toLocaleDateString("pt-BR") : "—"} />
      <SummaryRow label="Equipamentos" value={draft.equipamentos.join(", ") || "—"} />

      <div style={{ fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginTop: 12, marginBottom: 6 }}>REGISTROS / SERVIÇOS EXECUTADOS</div>
      {draft.registros.map((r, i) => (
        <div key={r.id} style={{ marginBottom: 8, paddingBottom: 8, borderBottom: `1px solid ${T.line}` }}>
          <div style={{ fontFamily: "IBM Plex Mono", fontSize: 11.5, color: T.teal, fontWeight: 700 }}>{fmtDateTimeShort(r.inicio)} → {fmtDateTimeShort(r.fim)}</div>
          <div style={{ fontSize: 13 }}>{r.servicos || "—"}</div>
          <div style={{ fontSize: 11.5, color: T.inkSoft }}>Área: {areaLabel(r)}</div>
        </div>
      ))}

      <div style={{ fontWeight: 700, fontSize: 12.5, color: T.inkSoft, marginTop: 12, marginBottom: 6 }}>EQUIPE DE CAMPO</div>
      <div style={{ marginBottom: 4 }}>{draft.equipeCampo.map((m) => m.nome).join(", ") || "—"}</div>

      <SummaryRow label={`Supervisor ${draft.empresa || ""}`} value={resp.supervisor_empresa ? resp.supervisor_empresa.nome : "—"} />
      <SummaryRow label="Operador Responsável CENIBRA" value={resp.cenibra_operador ? resp.cenibra_operador.nome : "—"} />
      <SummaryRow label="Supervisor Operacional CENIBRA" value={resp.cenibra_supervisor ? resp.cenibra_supervisor.nome : "—"} />
      {draft.fotoPlaca && (
        <div style={{ marginTop: 10 }}>
          <img src={draft.fotoPlaca} alt="Placa" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
        </div>
      )}
      <div style={{ marginTop: 12, background: T.amberSoft, borderRadius: 8, padding: "9px 12px", fontSize: 12.5, color: T.amber, fontWeight: 600 }}>
        Ao enviar, o relatório segue para assinatura do Supervisor da empresa → Operador CENIBRA → Supervisor Operacional CENIBRA. Ao concluir, um PDF é gerado e o e-mail é disparado automaticamente.
      </div>
    </div>
  );
}
function SummaryRow({ label, value, mono }) {
  return (
    <div className="flex items-start justify-between" style={{ padding: "7px 0", borderBottom: `1px solid ${T.line}` }}>
      <span style={{ color: T.inkSoft, fontWeight: 600 }}>{label}</span>
      <span style={{ textAlign: "right", maxWidth: "62%", fontFamily: mono ? "IBM Plex Mono" : "Inter" }}>{value || "—"}</span>
    </div>
  );
}

/* ---------------------------------------------------------------
   Detail view — read-only report + signature workflow
----------------------------------------------------------------*/
function DetailView({ report, session, onBack, onSign, onLoginClick }) {
  const [signing, setSigning] = useState(false);
  const [sigImg, setSigImg] = useState(null);

  const currentStage = STAGES[report.stageIndex];
  const assigned = currentStage ? report.responsaveis[currentStage.key] : null;
  const canActOnCurrent = !!(currentStage && assigned && session && session.personId === assigned.id);

  const confirmSign = async () => {
    if (!sigImg) return;
    await onSign(report, currentStage.key, sigImg);
    setSigning(false); setSigImg(null);
  };

  const downloadPDF = async () => {
    try {
      const doc = await buildReportPDF(report);
      doc.save(pdfFileName(report));
    } catch (e) { console.error(e); }
  };

  return (
    <div>
      <div style={{ background: T.card, borderRadius: 14, border: `1px solid ${T.line}`, padding: 16, marginBottom: 14 }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 4 }}>
          <span style={{ fontFamily: "IBM Plex Mono", fontSize: 12.5, color: T.orangeDeep, fontWeight: 700 }}>Nº {report.numero} · {report.empresa} · {report.coordenacao}</span>
          <StatusChip stageIndex={report.stageIndex} report={report} />
        </div>
        <div style={{ fontFamily: "Oswald", fontSize: 20, fontWeight: 600, marginBottom: 2 }}>{report.placaTag}</div>
        <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>Cliente: Cenibra</div>
        <div style={{ marginBottom: 14 }}><StageTracker stageIndex={report.stageIndex} report={report} /></div>

        <SummaryRow label="Data" value={new Date(report.data + "T00:00").toLocaleDateString("pt-BR")} />
        <SummaryRow label="Equipamentos" value={report.equipamentos.join(", ")} />
        <SummaryRow label="Saída" value={report.saida} />

        <Btn variant="ghost" style={{ marginTop: 12 }} onClick={downloadPDF}><FilePdf size={15} /> Baixar PDF</Btn>
      </div>

      <Section title="Registros de horário e serviços" icon={<Clock size={14} />}>
        {report.registros.map((r, i) => (
          <div key={r.id} style={{ padding: "9px 0", borderBottom: i < report.registros.length - 1 ? `1px solid ${T.line}` : "none" }}>
            <div style={{ fontFamily: "IBM Plex Mono", fontSize: 12, fontWeight: 700, color: T.teal }}>{fmtDateTimeShort(r.inicio)} → {fmtDateTimeShort(r.fim)}</div>
            <div style={{ fontFamily: "Inter", fontSize: 13, marginTop: 2 }}>{r.servicos || "—"}</div>
            <div style={{ fontFamily: "Inter", fontSize: 11.5, color: T.inkSoft }}>Área: {areaLabel(r)}</div>
          </div>
        ))}
      </Section>

      <Section title="Equipe de campo" icon={<Users size={14} />}>
        {(report.equipeCampo || []).length === 0 ? (
          <div style={{ fontSize: 13, color: T.inkSoft }}>Nenhum operador informado.</div>
        ) : report.equipeCampo.map((m) => (
          <div key={m.id} className="flex justify-between" style={{ padding: "5px 0", fontFamily: "Inter", fontSize: 13.5 }}>
            <span>{m.nome}</span>
            <span style={{ fontFamily: "IBM Plex Mono", fontSize: 12, color: T.inkSoft }}>{m.matricula}</span>
          </div>
        ))}
      </Section>

      <Section title="Equipe responsável" icon={<Users size={14} />}>
        {STAGES.map((s) => {
          const p = report.responsaveis[s.key];
          return (
            <div key={s.key} className="flex items-center justify-between" style={{ padding: "6px 0", fontFamily: "Inter", fontSize: 13 }}>
              <span style={{ color: T.inkSoft }}>{stageLabel(s, report)}</span>
              <span style={{ fontWeight: 600 }}>{p ? `${p.nome} (mat. ${p.matricula})` : "—"}</span>
            </div>
          );
        })}
      </Section>

      {report.fotoPlaca && (
        <Section title="Foto da placa" icon={<Camera size={14} />}>
          <img src={report.fotoPlaca} alt="Placa do caminhão" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
        </Section>
      )}

      <Section title="Assinaturas" icon={<PenLine size={14} />}>
        {STAGES.map((s, i) => {
          const sig = report.assinaturas[s.key];
          const isCurrent = i === report.stageIndex;
          const stageAssigned = report.responsaveis[s.key];
          return (
            <div key={s.key} style={{ padding: "10px 0", borderBottom: i < STAGES.length - 1 ? `1px solid ${T.line}` : "none" }}>
              <div className="flex items-center justify-between">
                <span style={{ fontFamily: "Inter", fontWeight: 700, fontSize: 13 }}>{stageLabel(s, report)}</span>
                {sig ? <CircleCheck size={17} color={T.green} /> : isCurrent ? (
                  <span style={{ fontFamily: "Inter", fontSize: 11, fontWeight: 700, color: T.orange }}>PENDENTE</span>
                ) : (
                  <span style={{ fontFamily: "Inter", fontSize: 11, color: "#B0B8C1" }}>—</span>
                )}
              </div>
              {sig && (
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 6 }}>
                  <img src={sig.assinatura} alt="assinatura" style={{ height: 34, background: "#fff", border: `1px solid ${T.line}`, borderRadius: 4 }} />
                  <div style={{ fontFamily: "Inter", fontSize: 12 }}>
                    <div style={{ fontWeight: 600 }}>{sig.nome} <span style={{ color: T.inkSoft, fontWeight: 400 }}>· mat. {sig.matricula}</span></div>
                    <div style={{ color: T.inkSoft, fontSize: 11 }}>{fmtDate(sig.dataHora)}</div>
                  </div>
                </div>
              )}
              {isCurrent && !sig && stageAssigned && canActOnCurrent && !signing && (
                <Btn variant="dark" style={{ marginTop: 8 }} onClick={() => setSigning(true)}><PenLine size={14} /> Assinar como {stageAssigned.nome}</Btn>
              )}
              {isCurrent && !sig && stageAssigned && canActOnCurrent && signing && (
                <div style={{ marginTop: 10, background: "#F7F9FA", borderRadius: 10, padding: 12 }}>
                  <Field label="Assinatura">
                    <SignaturePad onChange={setSigImg} />
                  </Field>
                  <div className="flex gap-2" style={{ marginTop: 8 }}>
                    <Btn variant="ghost" onClick={() => { setSigning(false); setSigImg(null); }}>Cancelar</Btn>
                    <Btn onClick={confirmSign} disabled={!sigImg}><Check size={15} /> Confirmar assinatura</Btn>
                  </div>
                </div>
              )}
              {isCurrent && !sig && !stageAssigned && (
                <div style={{ marginTop: 6, fontFamily: "Inter", fontSize: 12, color: T.danger }}>
                  Nenhuma pessoa designada para esta etapa neste relatório.
                </div>
              )}
              {isCurrent && !sig && stageAssigned && !canActOnCurrent && (
                <div style={{ marginTop: 6, fontFamily: "Inter", fontSize: 12, color: T.inkSoft }}>
                  Aguardando: <b>{stageAssigned.nome}</b> (mat. {stageAssigned.matricula}).{" "}
                  {!session ? (
                    <button onClick={onLoginClick} style={{ color: T.orangeDeep, fontWeight: 700, background: "none", border: "none", cursor: "pointer", padding: 0 }}>Entrar</button>
                  ) : (
                    <>Faça login com esse usuário para assinar.</>
                  )}
                </div>
              )}
            </div>
          );
        })}
        {report.stageIndex >= STAGES.length && (
          <div style={{ marginTop: 10, background: T.greenSoft, borderRadius: 8, padding: "10px 12px", color: T.green, fontFamily: "Inter", fontWeight: 700, fontSize: 13 }}>
            <div className="flex items-center gap-2"><CircleCheck size={16} /> Relatório concluído.</div>
            <div style={{ fontWeight: 500, fontSize: 12, marginTop: 4, color: T.inkSoft }}>
              {report.emailStatus === "enviado" && <>E-mail enviado para: {(report.emailRecipients || []).join(", ")}</>}
              {report.emailStatus === "simulado" && <>(Simulação) PDF baixado automaticamente — seria o anexo. E-mail não configurado, destinatários que receberiam: {(report.emailRecipients || []).join(", ")}</>}
              {report.emailStatus === "erro" && <>Falha ao enviar e-mail: {report.emailError}</>}
            </div>
            <Btn variant="ghost" style={{ marginTop: 8 }} onClick={downloadPDF}><FilePdf size={14} /> Baixar PDF novamente</Btn>
          </div>
        )}
      </Section>
    </div>
  );
}

function Section({ title, icon, children }) {
  return (
    <div style={{ background: T.card, borderRadius: 14, border: `1px solid ${T.line}`, padding: 16, marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "Inter", fontSize: 11.5, fontWeight: 700, color: T.inkSoft, letterSpacing: 0.4, textTransform: "uppercase", marginBottom: 10 }}>
        {icon} {title}
      </div>
      {children}
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin view — manage people + email config + CSV export
----------------------------------------------------------------*/
function AdminView({ db, onAddPerson, onRemovePerson, onAddPlaca, onRemovePlaca, onSaveEmailConfig, onBack, onExport }) {
  const reportsList = Object.values(db.reports);
  const conflicts = findPlateConflicts(reportsList);
  return (
    <div>
      <div style={{ fontFamily: "Oswald", fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Administração</div>
      <div style={{ fontFamily: "Inter", fontSize: 12.5, color: T.inkSoft, marginBottom: 16 }}>
        Gerencie pessoas, placas, empresas/coordenações e o envio automático de e-mail.
      </div>

      <Section title="Exportar dados" icon={<Download size={14} />}>
        <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>Gera um CSV (uma linha por registro de horário) para abrir no Excel e montar o BI. As horas ficam calculadas aqui mesmo sem aparecer no relatório.</div>
        <Btn variant="ghost" onClick={onExport}><Download size={15} /> Exportar CSV</Btn>
      </Section>

      <Section title={`Auditoria de placas${conflicts.length ? ` (${conflicts.length})` : ""}`} icon={<RefreshCw size={14} />}>
        <PlateConflictAudit conflicts={conflicts} />
      </Section>

      <Section title="Gerenciar pessoas" icon={<Users size={14} />}>
        <PeopleManager people={db.people} onAdd={onAddPerson} onRemove={onRemovePerson} />
      </Section>

      <Section title="Gerenciar placas" icon={<FileText size={14} />}>
        <PlacaManager placas={db.placas} onAdd={onAddPlaca} onRemove={onRemovePlaca} />
      </Section>

      <Section title="E-mail automático (EmailJS)" icon={<Mail size={14} />}>
        <EmailConfigPanel config={db.emailConfig} onSave={onSaveEmailConfig} />
      </Section>
    </div>
  );
}

function PlateConflictAudit({ conflicts }) {
  if (!conflicts.length) {
    return (
      <div style={{ fontSize: 12.5, color: T.inkSoft }}>
        Nenhum conflito encontrado: nenhuma placa aparece em coordenações diferentes com horários sobrepostos.
      </div>
    );
  }
  const fmtRange = (e) => `${fmtDateTimeShort(e.inicio.toISOString())} ate ${fmtDateTimeShort(e.fim.toISOString())}`;
  return (
    <div>
      <div style={{ fontSize: 12.5, color: T.danger, fontWeight: 600, marginBottom: 10 }}>
        Mesma placa registrada em coordenações diferentes com horários que se sobrepõem — um mesmo veículo não pode estar em dois lugares ao mesmo tempo. Verifique os relatórios abaixo.
      </div>
      {conflicts.map((c, i) => (
        <div key={i} style={{ border: `1.5px solid ${T.danger}`, borderRadius: 10, padding: 12, marginBottom: 10 }}>
          <div style={{ fontFamily: "IBM Plex Mono", fontSize: 13, fontWeight: 700, color: T.ink, marginBottom: 8 }}>Placa {c.placa}</div>
          {[c.a, c.b].map((e, j) => (
            <div key={j} style={{ fontSize: 12, color: T.inkSoft, marginBottom: j === 0 ? 4 : 0 }}>
              <b style={{ color: T.ink }}>Relatório Nº {e.numero}</b> · {e.empresa} · {e.coordenacao} · {fmtRange(e)}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function PlacaManager({ placas, onAdd, onRemove }) {
  const [placa, setPlaca] = useState("");
  const [empresa, setEmpresa] = useState(EMPRESAS[0]);
  const [foto, setFoto] = useState(null);

  const add = () => {
    if (!placa.trim()) return;
    onAdd({ placa: placa.trim().toUpperCase(), empresa, foto });
    setPlaca(""); setFoto(null);
  };

  return (
    <div>
      {placas.map((p) => (
        <div key={p.id} style={{ padding: "8px 0", borderBottom: `1px solid ${T.line}` }}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              {p.foto ? (
                <img src={p.foto} alt={p.placa} style={{ width: 56, height: 42, objectFit: "cover", borderRadius: 6, border: `1px solid ${T.line}` }} />
              ) : (
                <div style={{ width: 56, height: 42, borderRadius: 6, border: `1px dashed ${T.line}`, background: "#F7F9FA", display: "flex", alignItems: "center", justifyContent: "center" }}><Camera size={16} color={T.inkSoft} /></div>
              )}
              <div>
                <div style={{ fontFamily: "IBM Plex Mono", fontWeight: 700, fontSize: 13.5 }}>{p.placa}</div>
                <div style={{ fontSize: 11.5, color: T.inkSoft }}>{p.empresa}{p.foto ? "" : " · sem foto"}</div>
              </div>
            </div>
            <button onClick={() => onRemove(p.id)} style={{ background: "none", border: "none", color: T.danger, cursor: "pointer" }}><Trash2 size={14} /></button>
          </div>
        </div>
      ))}
      <div style={{ marginTop: 14, background: "#F7F9FA", borderRadius: 10, padding: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 12.5, marginBottom: 8 }}>Adicionar placa</div>
        <Field label="Placa / Tag"><TextInput value={placa} onChange={(e) => setPlaca(e.target.value.toUpperCase())} placeholder="Ex.: FOJ-3641" /></Field>
        <Field label="Empresa de Hidrojato">
          <select value={empresa} onChange={(e) => setEmpresa(e.target.value)} style={inputStyle}>
            {EMPRESAS.map((e) => <option key={e} value={e}>{e}</option>)}
          </select>
        </Field>
        <Field label="Foto de referência do veículo" hint="Opcional. Aparece para o operador ao escolher a placa">
          <PhotoCapture value={foto} onChange={setFoto} />
        </Field>
        <Btn onClick={add} disabled={!placa.trim()}><Plus size={14} /> Adicionar</Btn>
      </div>
    </div>
  );
}

function PeopleManager({ people, onAdd, onRemove }) {
  const [nome, setNome] = useState("");
  const [matricula, setMatricula] = useState("");
  const [role, setRole] = useState("campo_operador");
  const [empresa, setEmpresa] = useState(EMPRESAS[0]);
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("1234");
  const [coords, setCoords] = useState([]);

  const toggleCoord = (c) => setCoords(coords.includes(c) ? coords.filter((x) => x !== c) : [...coords, c]);
  const needsCoord = COORD_ROLES.includes(role);
  const needsEmpresa = EMPRESA_ROLES.includes(role);

  const add = () => {
    if (!nome.trim() || !matricula.trim()) return;
    onAdd({
      nome: nome.trim(), matricula: matricula.trim(), role, email: email.trim(), senha: senha || "1234",
      coordenacoes: needsCoord ? coords : [],
      empresa: needsEmpresa ? empresa : "",
    });
    setNome(""); setMatricula(""); setEmail(""); setSenha("1234"); setCoords([]);
  };

  return (
    <div>
      {people.map((p) => (
        <div key={p.id} style={{ padding: "8px 0", borderBottom: `1px solid ${T.line}` }}>
          <div className="flex items-center justify-between">
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{p.nome}</div>
              <div style={{ fontSize: 11.5, color: T.inkSoft }}>
                {ROLE_LABEL[p.role]} · mat. {p.matricula}
                {p.empresa ? " · " + p.empresa : ""}
                {p.coordenacoes && p.coordenacoes.length ? " · " + p.coordenacoes.join(", ") : ""}
              </div>
              <div style={{ fontSize: 11, color: T.inkSoft }}>{p.email}</div>
            </div>
            <button onClick={() => onRemove(p.id)} style={{ background: "none", border: "none", color: T.danger, cursor: "pointer" }}><Trash2 size={14} /></button>
          </div>
        </div>
      ))}
      <div style={{ marginTop: 14, background: "#F7F9FA", borderRadius: 10, padding: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 12.5, marginBottom: 8 }}>Adicionar pessoa</div>
        <Field label="Perfil">
          <select value={role} onChange={(e) => setRole(e.target.value)} style={inputStyle}>
            {ROLES.map((r) => <option key={r.value} value={r.value}>{r.label}</option>)}
          </select>
        </Field>
        <Field label="Nome"><TextInput value={nome} onChange={(e) => setNome(e.target.value)} /></Field>
        <Field label="Matrícula"><TextInput value={matricula} onChange={(e) => setMatricula(e.target.value)} /></Field>
        <Field label="E-mail"><TextInput value={email} onChange={(e) => setEmail(e.target.value)} placeholder="nome@empresa.com" /></Field>
        <Field label="Senha"><TextInput value={senha} onChange={(e) => setSenha(e.target.value)} /></Field>
        {needsEmpresa && (
          <Field label="Empresa de Hidrojato">
            <select value={empresa} onChange={(e) => setEmpresa(e.target.value)} style={inputStyle}>
              {EMPRESAS.map((e) => <option key={e} value={e}>{e}</option>)}
            </select>
          </Field>
        )}
        {needsCoord && (
          <Field label="Coordenações">
            <div className="flex flex-wrap gap-2">
              {COORDENACOES.map((c) => (
                <button key={c} type="button" onClick={() => toggleCoord(c)} style={{
                  padding: "5px 10px", borderRadius: 16, fontSize: 12, fontWeight: 600,
                  border: `1.5px solid ${coords.includes(c) ? T.teal : T.line}`,
                  background: coords.includes(c) ? T.teal : "#fff", color: coords.includes(c) ? "#fff" : T.ink, cursor: "pointer",
                }}>{c}</button>
              ))}
            </div>
          </Field>
        )}
        <Btn onClick={add} disabled={!nome.trim() || !matricula.trim()}><Plus size={14} /> Adicionar</Btn>
      </div>
    </div>
  );
}

function EmailConfigPanel({ config, onSave }) {
  const [serviceId, setServiceId] = useState(config.serviceId || "");
  const [templateId, setTemplateId] = useState(config.templateId || "");
  const [publicKey, setPublicKey] = useState(config.publicKey || "");
  const [testMsg, setTestMsg] = useState("");
  const [webhookUrl, setWebhookUrl] = useState(config.webhookUrl || "");
  const [destinoEmail, setDestinoEmail] = useState(config.destinoEmail || "");

  const save = () => onSave({ serviceId, templateId, publicKey, webhookUrl, destinoEmail });

  const testSend = async () => {
    setTestMsg("Enviando…");
    const result = await sendApprovalEmail(
      { numero: "TESTE", placaTag: "TESTE", coordenacao: "TESTE", empresa: "TESTE", responsaveis: { teste: { email: GMAIL_TESTE } } },
      { serviceId, templateId, publicKey }
    );
    if (result.ok) setTestMsg(`E-mail de teste enviado para ${result.recipients.join(", ")}.`);
    else if (result.simulated) setTestMsg("Simulado — preencha os 3 campos acima para enviar de verdade.");
    else setTestMsg(`Erro ao enviar: ${result.error}`);
  };

  return (
    <div>
      <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>
        Sem isso, ao concluir um relatório o app gera o PDF (baixa automaticamente) mas apenas simula o envio do e-mail (mostra quem receberia).
        Para enviar e-mails reais sem precisar de servidor: crie uma conta grátis em <b>emailjs.com</b>, conecte um e-mail (ex.: Gmail),
        crie um serviço e um template, e cole os 3 valores abaixo.
      </div>
      <Field label="E-mail de destino (recebe cópia de todo relatório concluído)"><TextInput value={destinoEmail} onChange={(e) => setDestinoEmail(e.target.value)} placeholder="nome@empresa.com" /></Field>
      <Field label="Webhook (opcional)" hint="URL do Formspree, Power Automate, Make… recebe os dados em JSON ao concluir"><TextInput value={webhookUrl} onChange={(e) => setWebhookUrl(e.target.value)} placeholder="https://..." /></Field>
      <Field label="Service ID"><TextInput value={serviceId} onChange={(e) => setServiceId(e.target.value)} placeholder="service_xxxxx" /></Field>
      <Field label="Template ID"><TextInput value={templateId} onChange={(e) => setTemplateId(e.target.value)} placeholder="template_xxxxx" /></Field>
      <Field label="Public Key"><TextInput value={publicKey} onChange={(e) => setPublicKey(e.target.value)} placeholder="xxxxxxxxxxxxxxxx" /></Field>
      <div className="flex gap-2">
        <Btn onClick={save}>Salvar</Btn>
        <Btn variant="ghost" onClick={testSend}><Mail size={14} /> Enviar e-mail de teste</Btn>
      </div>
      {testMsg && <div style={{ marginTop: 8, fontSize: 12.5, color: T.inkSoft }}>{testMsg}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

</body></html>
